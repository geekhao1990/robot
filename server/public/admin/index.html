<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小红书管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; background: #f5f6f8; }
  :root { --primary: #ff2442; }
  button { cursor: pointer; font-size: 14px; }
  /* 登录 */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#ff9a9e,#ff2442); }
  .login-card { background: #fff; padding: 40px; border-radius: 16px; width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .login-card h1 { color: var(--primary); font-size: 24px; text-align: center; margin-bottom: 6px; }
  .login-card p { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 12px 14px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .login-card button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; }
  .err { color: var(--primary); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  /* 布局 */
  #app { display: none; min-height: 100vh; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 200px; background: #1f1f28; color: #ccc; padding: 20px 0; }
  .sidebar .logo { color: #fff; font-size: 20px; font-weight: 700; padding: 0 24px 24px; }
  .sidebar .logo span { color: var(--primary); }
  .nav-item { padding: 14px 24px; cursor: pointer; font-size: 15px; }
  .nav-item:hover { background: #2a2a36; }
  .nav-item.active { background: var(--primary); color: #fff; }
  .main { margin-left: 200px; padding: 0; }
  .topbar { height: 60px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 5; }
  .topbar h2 { font-size: 18px; }
  .topbar .user { color: #666; font-size: 14px; }
  .topbar .user button { margin-left: 14px; background: #f3f3f3; border: none; padding: 8px 16px; border-radius: 6px; }
  .content { padding: 28px; }
  /* 概览卡片 */
  .cards { display: flex; gap: 20px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 12px; padding: 24px; min-width: 180px; flex: 1; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .card .n { font-size: 34px; font-weight: 800; color: var(--primary); }
  .card .l { color: #888; margin-top: 8px; font-size: 14px; }
  /* 工具条 */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; }
  .btn-sm { padding: 5px 12px; border-radius: 6px; border: 1px solid #ddd; background: #fff; margin-right: 6px; }
  .btn-sm.del { color: var(--primary); border-color: #ffccd2; }
  .btn-sm:disabled { color: #bbb; border-color: #eee; background: #f5f5f5; cursor: not-allowed; }
  /* 表格 */
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  th { background: #fafafa; color: #666; font-weight: 600; }
  td img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #f3f3f3; color: #666; }
  .tag.course { background: #fff0f2; color: var(--primary); }
  .tag.gold { background: #fff6db; color: #a86b00; }
  .tag.vip { background: #fbf0d9; color: #b4690e; }
  .tag.new { background: #ffe9ed; color: var(--primary); }
  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: #fff; border-radius: 12px; width: 520px; max-height: 86vh; overflow: auto; padding: 24px; }
  .modal h3 { margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .btn-cancel { background: #f3f3f3; border: none; padding: 10px 18px; border-radius: 8px; }
  .hint { color:#999; font-size:12px; margin-top:4px; }
  .search { padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 260px; }
  .search-box { display: flex; gap: 8px; align-items: center; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; }
  .pager-total { color: #888; font-size: 13px; margin-right: 6px; }
  /* 图片上传组件 */
  .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .img-cell { position: relative; width: 90px; height: 90px; border-radius: 8px; overflow: hidden; border: 1px solid #eee; cursor: grab; }
  .img-cell.dragging { opacity: .35; }
  .img-cell.drag-over { box-shadow: 0 0 0 2px var(--primary); }
  .img-cell img { width: 100%; height: 100%; object-fit: cover; }
  .img-del { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; line-height: 18px; text-align: center; background: rgba(0,0,0,.55); color: #fff; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .img-add { display: flex; align-items: center; justify-content: center; width: 90px; height: 90px; border: 1px dashed #ccc; border-radius: 8px; color: #bbb; font-size: 30px; cursor: pointer; }
  .img-add:hover { border-color: var(--primary); color: var(--primary); }
  .avatar-picker { display: flex; align-items: center; gap: 16px; }
  .avatar-preview { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; background: #f6f6f6; }
  .avatar-upload-btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; color: var(--primary); border: 1px solid #ffccd2; border-radius: 8px; cursor: pointer; }
  .avatar-upload-btn:hover { background: #fff3f5; }
  .category-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
  .category-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .category-actions { display: flex; align-items: center; flex-shrink: 0; }
</style>
</head>
<body>
  <!-- 登录 -->
  <div id="login">
    <div class="login-card">
      <h1>小红书<span>·</span>管理后台</h1>
      <p>内容运营管理系统（演示）</p>
      <div class="err" id="loginErr"></div>
      <input id="username" placeholder="账号 (admin)" value="admin" />
      <input id="password" type="password" placeholder="密码 (admin123)" value="admin123" />
      <button onclick="doLogin()">登 录</button>
    </div>
  </div>

  <!-- 主体 -->
  <div id="app">
    <div class="sidebar">
      <div class="logo">小红书<span>·</span>后台</div>
      <div class="nav-item active" data-view="overview" onclick="switchView('overview')">📊 数据概览</div>
      <div class="nav-item" data-view="notes" onclick="switchView('notes')">📝 笔记管理</div>
      <div class="nav-item" data-view="users" onclick="switchView('users')">👤 用户管理</div>
      <div class="nav-item" data-view="categories" onclick="switchView('categories')">🏷️ 笔记类型</div>
      <div class="nav-item" data-view="settings" onclick="switchView('settings')">⚙️ 功能设置</div>
    </div>
    <div class="main">
      <div class="topbar">
        <h2 id="viewTitle">数据概览</h2>
        <div class="user"><span id="who"></span><button onclick="logout()">退出</button></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

<script>
const API = '';
let token = localStorage.getItem('admin_token') || '';
let me = localStorage.getItem('admin_user') || '';

function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, opts.headers || {});
  return fetch(API + path, opts).then(async (r) => {
    if (r.status === 401) { logout(); throw new Error('未登录'); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || '请求失败');
    return data;
  });
}

function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  fetch(API + '/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  }).then(async (r) => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '登录失败');
    token = d.token; me = d.username;
    localStorage.setItem('admin_token', token);
    localStorage.setItem('admin_user', me);
    enterApp();
  }).catch((e) => document.getElementById('loginErr').textContent = e.message);
}

function logout() {
  token = ''; me = '';
  localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = '👋 ' + me;
  switchView('overview');
}

const TITLES = { overview: '数据概览', notes: '笔记管理', users: '用户管理', categories: '笔记类型', settings: '功能设置' };
const BASE_CATEGORIES = ['资料', '课程', '金手指'];
function switchView(v) {
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.view === v));
  document.getElementById('viewTitle').textContent = TITLES[v];
  if (v === 'overview') renderOverview();
  if (v === 'notes') renderNotes();
  if (v === 'users') renderUsers();
  if (v === 'categories') renderCategories();
  if (v === 'settings') renderSettings();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// 概览
function renderOverview() {
  api('/api/admin/stats').then((s) => {
    document.getElementById('content').innerHTML = `
      <div class="cards">
        <div class="card"><div class="n">${s.notes}</div><div class="l">笔记总数</div></div>
        <div class="card"><div class="n">${s.materials}</div><div class="l">资料内容</div></div>
        <div class="card"><div class="n">${s.courses}</div><div class="l">课程内容</div></div>
        <div class="card"><div class="n">${s.goldNotes}</div><div class="l">金手指内容</div></div>
        <div class="card"><div class="n">${s.users}</div><div class="l">用户总数</div></div>
        <div class="card"><div class="n">${s.newUsers}</div><div class="l">新注册用户</div></div>
        <div class="card"><div class="n">${s.vipUsers}</div><div class="l">VIP 用户</div></div>
        <div class="card"><div class="n">${s.categories}</div><div class="l">分类数</div></div>
      </div>`;
  });
}

// 笔记
const PAGE_SIZE = 10;
let _notes = [], _users = [], _categories = BASE_CATEGORIES.slice();
let _noteKeyword = '';
let _notePage = 1;

// 分页控件（右下角）
function pagerHtml(page, pages, total, fnName) {
  return `<div class="pager">
    <span class="pager-total">共 ${total} 条 · 第 ${page}/${pages} 页</span>
    <button class="btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="${fnName}(${page - 1})">上一页</button>
    <button class="btn-sm" ${page >= pages ? 'disabled' : ''} onclick="${fnName}(${page + 1})">下一页</button>
  </div>`;
}

function renderNotes() {
  Promise.all([api('/api/admin/notes'), api('/api/admin/users'), api('/api/admin/categories')])
    .then(([notes, users, categories]) => {
      _notes = notes; _users = users; _categories = categories;
      _notePage = 1;
      drawNotes();
    });
}

function doNoteSearch() {
  const inp = document.getElementById('noteSearch');
  _noteKeyword = (inp ? inp.value : '').trim();
  _notePage = 1;
  drawNotes();
}
function gotoNotePage(p) { _notePage = p; drawNotes(); }

function drawNotes() {
  const kw = _noteKeyword.toLowerCase();
  const all = kw ? _notes.filter((n) =>
    (n.title || '').toLowerCase().includes(kw) ||
    (n.content || '').toLowerCase().includes(kw) ||
    (n.category || '').toLowerCase().includes(kw) ||
    (n.author && (n.author.name || '').toLowerCase().includes(kw))
  ) : _notes;
  const total = all.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_notePage > pages) _notePage = pages;
  const start = (_notePage - 1) * PAGE_SIZE;
  const pageItems = all.slice(start, start + PAGE_SIZE);
  const rows = pageItems.map((n, i) => `
    <tr>
      <td>${start + i + 1}</td>
      <td><img src="${esc(n.cover)}" /></td>
      <td>${esc(n.title)}</td>
      <td>${esc(n.author && n.author.name)}</td>
      <td><span class="tag ${n.type === 'gold' ? 'gold' : (n.type === 'course' ? 'course' : '')}">${esc(n.category || '资料')}</span></td>
      <td>赞 ${n.likes} · 藏 ${n.collects} · 评 ${n.comments}</td>
      <td>
        <button class="btn-sm" onclick='editNote("${n.id}")'>编辑</button>
        <button class="btn-sm del" onclick='delNote("${n.id}")'>删除</button>
      </td>
    </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <input id="noteSearch" class="search" placeholder="按标题/内容/分类/作者搜索" value="${esc(_noteKeyword)}"
               onkeydown="if(event.key==='Enter')doNoteSearch()" />
        <button class="btn-primary" onclick="doNoteSearch()">搜索</button>
      </div>
      <button class="btn-primary" onclick="editNote()">+ 新增笔记</button>
    </div>
    <table><thead><tr><th>序号</th><th>封面</th><th>标题</th><th>作者</th><th>分类</th><th>互动数据</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${pagerHtml(_notePage, pages, total, 'gotoNotePage')}`;
}

let _modalImages = [];
function editNote(id) {
  const n = id ? _notes.find((x) => x.id === id) : {};
  const legacyLink = n.courseUrl || '';
  const baiduLink = n.baiduUrl || (legacyLink && !/quark\.cn/i.test(legacyLink) ? legacyLink : '');
  const quarkLink = n.quarkUrl || (legacyLink && /quark\.cn/i.test(legacyLink) ? legacyLink : '');
  const officialAuthors = _users.filter((u) => u.official === true);
  const userOpts = officialAuthors.map((u) => `<option value="${u.id}" ${n.authorId === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
  const selectedCategory = n.category || (n.type === 'gold' ? '金手指' : (n.type === 'course' ? '课程' : '资料'));
  const categoryOpts = _categories.map((category) => `<option value="${esc(category)}" ${selectedCategory === category ? 'selected' : ''}>${esc(category)}</option>`).join('');
  if (!userOpts) return alert('请先在用户管理中创建并标记官方账号');
  _modalImages = (n.images || []).slice();
  openModal(`${id ? '编辑' : '新增'}内容`, `
    <div class="field"><label>标题</label><input id="f_title" value="${esc(n.title)}" /></div>
    <div class="field"><label>正文</label><textarea id="f_content">${esc(n.content)}</textarea></div>
    <div class="field"><label>作者</label><select id="f_author">${userOpts}</select></div>
    <div class="field"><label>笔记类型</label><select id="f_category" onchange="syncResourceField()">${categoryOpts}</select></div>
    <div id="resourceField">
      <div class="field"><label>百度网盘地址（选填）</label><input id="f_baidu" value="${esc(baiduLink)}" placeholder="百度网盘链接及提取码" /></div>
      <div class="field"><label>夸克网盘地址（选填）</label><input id="f_quark" value="${esc(quarkLink)}" placeholder="夸克网盘链接及提取码" /></div>
      <div class="hint">至少填写一个；前台只显示已填写的网盘。</div>
    </div>
    <div class="field" id="goldHint"><div class="hint">金手指点击领取后展示企业微信二维码，无需填写获取地址。</div></div>
    <div class="field"><label>图片</label>
      <div id="imgGrid" class="img-grid"></div>
      <div class="hint">支持多图上传；拖拽图片可调整顺序，第一张为封面</div>
    </div>
    ${id ? `<div class="hint">互动数据：赞 ${n.likes || 0} · 藏 ${n.collects || 0} · 评 ${n.comments || 0}（不可修改）</div>` : ''}
  `, () => {
    const baiduUrl = document.getElementById('f_baidu').value.trim();
    const quarkUrl = document.getElementById('f_quark').value.trim();
    const category = document.getElementById('f_category').value;
    const type = category === '金手指' ? 'gold' : (category === '课程' ? 'course' : 'material');
    if (!baiduUrl && !quarkUrl && type !== 'gold') return alert('请至少填写一个网盘地址');
    const body = {
      title: document.getElementById('f_title').value,
      content: document.getElementById('f_content').value,
      authorId: document.getElementById('f_author').value,
      type,
      category,
      baiduUrl,
      quarkUrl,
      images: _modalImages,
    };
    const req = id ? api('/api/admin/notes/' + id, { method: 'PUT', body: JSON.stringify(body) })
                   : api('/api/admin/notes', { method: 'POST', body: JSON.stringify(body) });
    req.then(() => { closeModal(); renderNotes(); });
  });
  renderImgGrid();
  syncResourceField();
}

function syncResourceField() {
  const type = document.getElementById('f_category');
  const resource = document.getElementById('resourceField');
  const goldHint = document.getElementById('goldHint');
  if (!type || !resource || !goldHint) return;
  const isGold = type.value === '金手指';
  resource.style.display = isGold ? 'none' : 'block';
  goldHint.style.display = isGold ? 'block' : 'none';
}

let _dragImageIndex = -1;
function renderImgGrid() {
  const grid = document.getElementById('imgGrid');
  if (!grid) return;
  grid.innerHTML =
    _modalImages.map((url, i) => `
      <div class="img-cell" draggable="true" ondragstart="startImageDrag(event,${i})" ondragover="overImageDrag(event)" ondragleave="leaveImageDrag(event)" ondrop="dropImage(event,${i})" ondragend="endImageDrag()">
        <img src="${esc(url)}" />
        <span class="img-del" onclick="removeModalImage(${i})">×</span>
      </div>`).join('') +
    `<label class="img-add">＋<input type="file" accept="image/*" multiple style="display:none" onchange="onPickImages(event)" /></label>`;
}
function startImageDrag(event, i) {
  _dragImageIndex = i;
  event.currentTarget.classList.add('dragging');
  if (event.dataTransfer) event.dataTransfer.effectAllowed = 'move';
}
function overImageDrag(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}
function leaveImageDrag(event) { event.currentTarget.classList.remove('drag-over'); }
function dropImage(event, targetIndex) {
  event.preventDefault();
  if (_dragImageIndex < 0 || _dragImageIndex === targetIndex) return endImageDrag();
  const moved = _modalImages.splice(_dragImageIndex, 1)[0];
  _modalImages.splice(targetIndex, 0, moved);
  _dragImageIndex = -1;
  renderImgGrid();
}
function endImageDrag() {
  _dragImageIndex = -1;
  document.querySelectorAll('.img-cell').forEach((cell) => cell.classList.remove('dragging', 'drag-over'));
}
function removeModalImage(i) { _modalImages.splice(i, 1); renderImgGrid(); }
function onPickImages(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const grid = document.getElementById('imgGrid');
  if (grid) grid.style.opacity = '.5';
  Promise.all(files.map(uploadAdminImage))
    .then((urls) => { _modalImages = _modalImages.concat(urls.filter(Boolean)); renderImgGrid(); })
    .catch(() => alert('图片上传失败'))
    .then(() => { if (grid) grid.style.opacity = '1'; });
}
function uploadAdminImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  return fetch('/api/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd })
    .then((r) => r.json()).then((d) => d.url);
}

function delNote(id) {
  if (!confirm('确定删除这篇笔记吗？')) return;
  api('/api/admin/notes/' + id, { method: 'DELETE' }).then(renderNotes);
}

// 用户
function fmtDate(ts) { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function vipActive(u) { return u.vip && (u.vipPermanent || (u.vipExpire && u.vipExpire > Date.now())); }

let _userKeyword = '';
let _userPage = 1;
function renderUsers() {
  api('/api/admin/users').then((users) => {
    _users = users;
    _userPage = 1;
    drawUsers();
  });
}

// 点击「搜索」按钮才触发（避免中文输入法在输入过程中被打断）
function doUserSearch() {
  const inp = document.getElementById('userSearch');
  _userKeyword = (inp ? inp.value : '').trim();
  _userPage = 1;
  drawUsers();
}
function gotoUserPage(p) { _userPage = p; drawUsers(); }

function drawUsers() {
  const kw = _userKeyword.toLowerCase();
  const all = kw ? _users.filter((u) =>
    (u.name || '').toLowerCase().includes(kw) ||
    (u.id || '').toLowerCase().includes(kw) ||
    (u.phone || '').includes(kw)
  ) : _users;
  const total = all.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_userPage > pages) _userPage = pages;
  const start = (_userPage - 1) * PAGE_SIZE;
  const pageItems = all.slice(start, start + PAGE_SIZE);
  const rows = pageItems.map((u, i) => {
    const active = vipActive(u);
    const status = active
      ? (u.vipPermanent ? '<span class="tag vip">永久会员</span>' : `<span class="tag vip">${u.vipPlan === 'year' ? '年卡' : '月卡'} · 至 ${fmtDate(u.vipExpire)}</span>`)
      : (u.vipExpire ? '<span class="tag">已过期</span>' : '<span class="tag">未开通</span>');
    return `
      <tr>
        <td>${start + i + 1}</td>
        <td><img src="${esc(u.avatar)}" /></td>
        <td>${esc(u.name)}</td>
        <td>${esc(u.phone || '未绑定')}</td>
        <td>
          ${Array.isArray(u.tags) && u.tags.includes('new') ? '<span class="tag new">新用户</span>' : ''}
          <div class="hint">${esc(u.id)}</div>
          <div class="hint">${u.createdAt ? '注册于 ' + fmtDate(u.createdAt) : ''}</div>
        </td>
        <td>${u.official ? '<span class="tag course">官方账号</span>' : '<span class="tag">普通用户</span>'}</td>
        <td>${status}</td>
        <td>
          <button class="btn-sm" onclick='setVip("${u.id}","month")'>开通一个月</button>
          <button class="btn-sm" onclick='setVip("${u.id}","year")'>开通年卡</button>
          <button class="btn-sm" onclick='setVip("${u.id}","lifetime")'>开通永久卡</button>
          <button class="btn-sm del" ${active ? '' : 'disabled'} onclick='setVip("${u.id}","none")'>取消VIP</button>
          <button class="btn-sm" onclick='editUser("${u.id}")'>编辑</button>
        </td>
      </tr>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <input id="userSearch" class="search" placeholder="按昵称、手机号或会员编号搜索" value="${esc(_userKeyword)}"
               onkeydown="if(event.key==='Enter')doUserSearch()" />
        <button class="btn-primary" onclick="doUserSearch()">搜索</button>
      </div>
      <button class="btn-primary" onclick="editUser()">+ 新增用户</button>
    </div>
    <table><thead><tr><th>序号</th><th>头像</th><th>昵称</th><th>手机号</th><th>注册信息</th><th>账号类型</th><th>VIP 状态</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${pagerHtml(_userPage, pages, total, 'gotoUserPage')}`;
}

function setVip(id, plan) {
  const label = { month: '开通一个月会员', year: '开通一年会员', lifetime: '开通永久会员', none: '取消VIP' }[plan];
  if (!confirm(`确定为该用户「${label}」吗？`)) return;
  api('/api/admin/users/' + id + '/vip', { method: 'PUT', body: JSON.stringify({ plan }) }).then(renderUsers);
}
function editUser(id) {
  const u = id ? _users.find((x) => x.id === id) : {};
  _modalAvatar = u.avatar || '';
  openModal(`${id ? '编辑' : '新增'}用户`, `
    <div class="field"><label>昵称</label><input id="u_name" value="${esc(u.name)}" /></div>
    ${id ? `<div class="field"><label>手机号</label><input value="${esc(u.phone || '未绑定')}" disabled /><div class="hint">手机号只能由用户在小程序内通过微信授权绑定</div></div>` : ''}
    <div class="field"><label>头像</label><div id="userAvatarPicker" class="avatar-picker"></div><div class="hint">支持 JPG、PNG、GIF、WebP，上限8MB</div></div>
    <div class="field"><label>简介</label><input id="u_desc" value="${esc(u.desc)}" /></div>
    <div class="field"><label>账号类型</label><select id="u_official">
      <option value="false" ${u.official ? '' : 'selected'}>普通用户（不可发布笔记）</option>
      <option value="true" ${u.official ? 'selected' : ''}>官方账号（可作为笔记作者）</option>
    </select></div>
    <div class="hint">VIP 开通/取消请用列表中的「开通月卡 / 年卡 / 取消VIP」按钮</div>
  `, () => {
    const body = {
      name: document.getElementById('u_name').value,
      avatar: _modalAvatar,
      desc: document.getElementById('u_desc').value,
      official: document.getElementById('u_official').value === 'true',
    };
    const req = id ? api('/api/admin/users/' + id, { method: 'PUT', body: JSON.stringify(body) })
                   : api('/api/admin/users', { method: 'POST', body: JSON.stringify(body) });
    req.then(() => { closeModal(); renderUsers(); });
  });
  renderUserAvatarPicker();
}

let _modalAvatar = '';
function renderUserAvatarPicker() {
  const picker = document.getElementById('userAvatarPicker');
  if (!picker) return;
  picker.innerHTML = `
    ${_modalAvatar ? `<img class="avatar-preview" src="${esc(_modalAvatar)}" />` : '<div class="avatar-preview"></div>'}
    <label class="avatar-upload-btn">${_modalAvatar ? '更换头像' : '上传头像'}<input type="file" accept="image/*" style="display:none" onchange="onPickUserAvatar(event)" /></label>`;
}
function onPickUserAvatar(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const picker = document.getElementById('userAvatarPicker');
  if (picker) picker.style.opacity = '.5';
  uploadAdminImage(file)
    .then((url) => { _modalAvatar = url; renderUserAvatarPicker(); })
    .catch(() => alert('头像上传失败'))
    .then(() => { if (picker) picker.style.opacity = '1'; });
}

// 分类
function renderCategories() {
  Promise.all([api('/api/admin/categories'), api('/api/admin/notes')]).then(([cats, notes]) => {
    _categories = cats;
    const items = cats.map((cat) => {
      const fixed = BASE_CATEGORIES.includes(cat);
      const count = notes.filter((n) => n.category === cat).length;
      return `<div class="category-row">
        <div class="category-main"><strong>${esc(cat)}</strong>${fixed ? '<span class="tag">系统类型</span>' : ''}<span class="tag">${count} 篇</span></div>
        <div class="category-actions">
          ${fixed ? '<span class="hint">不可修改或删除</span>' : `<button class="btn-sm" onclick="renameCategory(decodeURIComponent('${encodeURIComponent(cat)}'))">重命名</button><button class="btn-sm del" onclick="deleteCategory(decodeURIComponent('${encodeURIComponent(cat)}'))">删除</button>`}
        </div>
      </div>`;
    }).join('');
    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:560px">
        <div class="field">
          <label>新增笔记类型</label>
          <div class="search-box"><input id="newCategoryName" class="search" maxlength="12" placeholder="输入类型名称" /><button class="btn-primary" onclick="addCategory()">新增</button></div>
          <div class="hint">资料、课程、金手指为系统类型，永久保留；自定义类型按资料类领取逻辑处理。</div>
        </div>
        ${items}
      </div>`;
  });
}

function addCategory() {
  const input = document.getElementById('newCategoryName');
  const name = (input ? input.value : '').trim();
  if (!name) return alert('请输入笔记类型名称');
  api('/api/admin/categories', { method: 'POST', body: JSON.stringify({ name }) })
    .then(renderCategories).catch((error) => alert(error.message));
}
function renameCategory(oldName) {
  const name = prompt('请输入新的笔记类型名称', oldName);
  if (name == null || !name.trim() || name.trim() === oldName) return;
  api('/api/admin/categories/' + encodeURIComponent(oldName), { method: 'PUT', body: JSON.stringify({ name: name.trim() }) })
    .then(renderCategories).catch((error) => alert(error.message));
}
function deleteCategory(name) {
  if (!confirm(`确定删除笔记类型「${name}」吗？`)) return;
  api('/api/admin/categories/' + encodeURIComponent(name), { method: 'DELETE' })
    .then(renderCategories).catch((error) => alert(error.message));
}

// 功能设置
function renderSettings() {
  Promise.all([api('/api/admin/settings'), api('/api/admin/notes')]).then(([settings, notes]) => {
    const noteOptions = notes.filter((n) => n.type === 'gold').map((n) => `
      <option value="${esc(n.id)}" ${n.id === settings.featuredNoteId ? 'selected' : ''}>
        ${esc(n.title)}（${esc(n.author && n.author.name)}）
      </option>`).join('');
    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:640px">
        <div class="field">
          <label>首页红色加号（金手指）打开的笔记</label>
          <select id="settingFeatured">${noteOptions}</select>
          <div class="hint">这篇笔记点击「点击领取」时直接展示企业微信二维码，不播放广告。</div>
        </div>
        <div class="field">
          <label>普通笔记激励广告</label>
          <select id="settingAd">
            <option value="false" ${settings.rewardedAdEnabled ? '' : 'selected'}>关闭</option>
            <option value="true" ${settings.rewardedAdEnabled ? 'selected' : ''}>开启</option>
          </select>
          <div class="hint">关闭后直接展示领取链接；开启后需看完激励广告才能领取。</div>
        </div>
        <div class="field">
          <label>VIP 功能</label>
          <select id="settingVip">
            <option value="false" ${settings.vipEnabled ? '' : 'selected'}>关闭</option>
            <option value="true" ${settings.vipEnabled ? 'selected' : ''}>开启</option>
          </select>
          <div class="hint">开启后仅有效VIP可进入广告领取，非VIP展示9.9元月卡和企业微信二维码；关闭后所有登录用户按广告设置领取。</div>
        </div>
        <button class="btn-primary" onclick="saveSettings()">保存设置</button>
      </div>`;
  });
}

function saveSettings() {
  const body = {
    featuredNoteId: document.getElementById('settingFeatured').value,
    rewardedAdEnabled: document.getElementById('settingAd').value === 'true',
    vipEnabled: document.getElementById('settingVip').value === 'true',
  };
  api('/api/admin/settings', { method: 'PUT', body: JSON.stringify(body) })
    .then(() => alert('设置已保存'));
}

// 弹窗
function openModal(title, html, onOk) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${esc(title)}</h3>
        ${html}
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">取消</button>
          <button class="btn-primary" id="modalOk">保存</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalOk').onclick = onOk;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

// 自动登录
if (token) enterApp();
</script>
</body>
</html>
