<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiuLai股票管理系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; background: #f5f6f8; }
  :root { --primary: #ff2442; }
  button { cursor: pointer; font-size: 14px; }
  /* 登录 */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#ff9a9e,#ff2442); }
  .login-card { background: #fff; padding: 40px; border-radius: 16px; width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .login-card h1 { color: var(--primary); font-size: 24px; text-align: center; margin-bottom: 6px; }
  .login-card p { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 12px 14px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .login-card button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; }
  .err { color: var(--primary); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  /* 布局 */
  #app { display: none; min-height: 100vh; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 200px; background: #1f1f28; color: #ccc; padding: 20px 0; }
  .sidebar .logo { color: #fff; font-size: 20px; font-weight: 700; padding: 0 24px 24px; }
  .sidebar .logo span { color: var(--primary); }
  .nav-item { position: relative; padding: 14px 24px; cursor: pointer; font-size: 15px; }
  .nav-item:hover { background: #2a2a36; }
  .nav-item.active { background: var(--primary); color: #fff; }
  .nav-badge { display: none; position: absolute; top: 9px; right: 18px; min-width: 18px; height: 18px; padding: 0 5px; color: #fff; font-size: 11px; line-height: 18px; text-align: center; background: #ff2442; border: 2px solid #1f1f28; border-radius: 999px; box-sizing: content-box; }
  .nav-item.active .nav-badge { background: #fff; color: #ff2442; border-color: #ff2442; }
  .main { margin-left: 200px; padding: 0; }
  .topbar { height: 60px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 5; }
  .topbar h2 { font-size: 18px; }
  .topbar .user { color: #666; font-size: 14px; }
  .topbar .user button { margin-left: 14px; background: #f3f3f3; border: none; padding: 8px 16px; border-radius: 6px; }
  .content { padding: 28px; }
  /* 概览卡片 */
  .cards { display: flex; gap: 20px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 12px; padding: 24px; min-width: 180px; flex: 1; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .card .n { font-size: 34px; font-weight: 800; color: var(--primary); }
  .card .l { color: #888; margin-top: 8px; font-size: 14px; }
  /* 工具条 */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; }
  .btn-sm { padding: 5px 12px; border-radius: 6px; border: 1px solid #ddd; background: #fff; margin-right: 6px; }
  .btn-sm.del { color: var(--primary); border-color: #ffccd2; }
  .btn-sm:disabled { color: #bbb; border-color: #eee; background: #f5f5f5; cursor: not-allowed; }
  /* 表格 */
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  th { background: #fafafa; color: #666; font-weight: 600; }
  td img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #f3f3f3; color: #666; }
  .tag.course { background: #fff0f2; color: var(--primary); }
  .tag.gold { background: #fff6db; color: #a86b00; }
  .tag.ad { background: #eaf4ff; color: #1677c8; }
  .tag.vip { background: #fbf0d9; color: #b4690e; }
  .tag.new { background: #ffe9ed; color: var(--primary); }
  .tag.paid { background: #e8f8ef; color: #168c4b; }
  .tag.pending { background: #fff6db; color: #9b6a00; }
  .tag.rejected { background: #f1f1f1; color: #888; }
  .tag.approved { background: #eaf3ff; color: #2877c7; }
  .switch { position: relative; display: inline-block; width: 42px; height: 24px; vertical-align: middle; }
  .switch input { width: 0; height: 0; opacity: 0; }
  .switch-slider { position: absolute; inset: 0; cursor: pointer; background: #c9cdd4; border-radius: 999px; transition: .18s ease; }
  .switch-slider::before { position: absolute; bottom: 3px; left: 3px; width: 18px; height: 18px; content: ''; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .18s ease; }
  .switch input:checked + .switch-slider { background: var(--primary); }
  .switch input:checked + .switch-slider::before { transform: translateX(18px); }
  .switch-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: #fff; border-radius: 12px; width: 520px; max-height: 86vh; overflow: auto; padding: 24px; }
  .modal h3 { margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .btn-cancel { background: #f3f3f3; border: none; padding: 10px 18px; border-radius: 8px; }
  .hint { color:#999; font-size:12px; margin-top:4px; }
  .search { padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 260px; }
  .search-box { display: flex; gap: 8px; align-items: center; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; }
  .pager-total { color: #888; font-size: 13px; margin-right: 6px; }
  /* 图片上传组件 */
  .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .img-cell { position: relative; width: 90px; height: 90px; border-radius: 8px; overflow: hidden; border: 1px solid #eee; cursor: grab; }
  .img-cell.dragging { opacity: .35; }
  .img-cell.drag-over { box-shadow: 0 0 0 2px var(--primary); }
  .img-cell img { width: 100%; height: 100%; object-fit: cover; }
  .img-del { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; line-height: 18px; text-align: center; background: rgba(0,0,0,.55); color: #fff; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .img-add { display: flex; align-items: center; justify-content: center; width: 90px; height: 90px; border: 1px dashed #ccc; border-radius: 8px; color: #bbb; font-size: 30px; cursor: pointer; }
  .img-add:hover { border-color: var(--primary); color: var(--primary); }
  .avatar-picker { display: flex; align-items: center; gap: 16px; }
  .avatar-preview { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; background: #f6f6f6; }
  .avatar-upload-btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; color: var(--primary); border: 1px solid #ffccd2; border-radius: 8px; cursor: pointer; }
  .avatar-upload-btn:hover { background: #fff3f5; }
  .category-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
  .category-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .category-actions { display: flex; align-items: center; flex-shrink: 0; }
  .gold-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
  .gold-form .field { flex: 1 1 130px; min-width: 130px; margin-bottom: 0; }
  .gold-form-actions { display: flex; align-items: center; gap: 8px; padding-bottom: 1px; }
  .gold-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .banner-admin-list { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
  .banner-admin-card { width: 250px; overflow: hidden; background: #fafafa; border: 1px solid #eee; border-radius: 10px; }
  .banner-admin-card img { display: block; width: 100%; height: 110px; object-fit: cover; background: #eee; }
  .banner-admin-info { padding: 10px 12px; }
  .banner-admin-title { min-height: 38px; color: #555; font-size: 13px; line-height: 1.45; }
  .banner-admin-actions { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .banner-admin-actions .btn-sm { margin-right: 0; padding: 5px 9px; }
  .banner-picker { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .banner-preview { width: 100%; height: 180px; object-fit: cover; background: #f5f5f5; border: 1px solid #eee; border-radius: 10px; }
  .admin-toast { position: fixed; top: 78px; right: 28px; z-index: 100; max-width: min(360px, calc(100vw - 40px)); padding: 12px 16px; color: #168c4b; font-size: 14px; line-height: 1.4; background: #effaf3; border: 1px solid #b9e8c9; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); opacity: 0; pointer-events: none; transform: translateY(-8px); transition: opacity .18s ease, transform .18s ease; }
  .admin-toast.show { opacity: 1; transform: translateY(0); }
  .admin-toast.error { color: #c6283d; background: #fff1f3; border-color: #ffc8d1; }
  .ai-upload-layout { display: flex; gap: 24px; align-items: flex-start; }
  .ai-upload-card, .ai-result-card { flex: 1; min-width: 0; padding: 22px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .ai-upload-card h3, .ai-result-card h3 { margin-bottom: 8px; }
  .ai-dropzone { display: flex; min-height: 360px; margin-top: 18px; align-items: center; justify-content: center; overflow: hidden; text-align: center; background: #fafafa; border: 2px dashed #d8dbe2; border-radius: 12px; transition: .18s ease; }
  .ai-dropzone.drag-over { background: #fff3f5; border-color: var(--primary); }
  .ai-dropzone img { display: block; width: 100%; max-height: 520px; object-fit: contain; }
  .ai-empty-icon { margin-bottom: 10px; color: #b8bdc7; font-size: 46px; }
  .ai-upload-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .ai-upload-actions .btn-primary:disabled { background: #c9cdd4; cursor: not-allowed; }
  .ai-under-image { margin-top: 22px; padding-top: 20px; border-top: 1px solid #eceef2; }
  .ai-under-image h3 { margin-bottom: 4px; }
  .ai-auto-review-status { margin-top: 10px; color: #8a8f99; font-size: 12px; text-align: right; }
  .ai-result-empty { display: flex; min-height: 360px; align-items: center; justify-content: center; color: #aaa; text-align: center; }
  .ai-result-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 18px; }
  .ai-result-item { padding: 12px 14px; background: #f7f8fa; border-radius: 8px; }
  .ai-result-item .label { color: #8a8f99; font-size: 12px; }
  .ai-result-item .value { margin-top: 5px; color: #222; font-size: 17px; font-weight: 650; word-break: break-all; }
  .ai-result-item input, .ai-result-item select { width: 100%; height: 38px; margin-top: 6px; padding: 7px 9px; color: #222; font-size: 15px; font-weight: 600; background: #fff; border: 1px solid #dfe2e8; border-radius: 7px; }
  .ai-result-item input[readonly] { color: #727784; background: #f0f1f3; }
  .ai-result-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .ai-report-editor { width: 100%; min-height: 310px; margin-top: 14px; padding: 12px; color: #333; font: 14px/1.75 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; border: 1px solid #dfe2e8; border-radius: 8px; resize: vertical; }
  .ai-validation { margin-top: 16px; padding: 14px; line-height: 1.8; background: #f7f8fa; border-radius: 8px; }
  .ai-validation.pass { color: #168c4b; background: #effaf3; }
  .ai-validation.fail { color: #c6283d; background: #fff1f3; }
  .ai-json { width: 100%; min-height: 210px; margin-top: 14px; padding: 12px; color: #444; font: 13px/1.6 Consolas, monospace; background: #f7f8fa; border: 1px solid #eee; border-radius: 8px; resize: vertical; }
  @media (max-width: 980px) { .ai-upload-layout { flex-direction: column; } .ai-upload-card, .ai-result-card { width: 100%; } }
</style>
</head>
<body>
  <!-- 登录 -->
  <div id="login">
    <div class="login-card">
      <h1>NiuLai<span>·</span>股票管理系统</h1>
      <p>内容运营管理系统</p>
      <div class="err" id="loginErr"></div>
      <input id="username" placeholder="账号 (admin)" value="admin" />
      <input id="password" type="password" placeholder="密码 (admin)" value="admin" />
      <button onclick="doLogin()">登 录</button>
    </div>
  </div>

  <!-- 主体 -->
  <div id="app">
    <div class="sidebar">
      <div class="logo">NiuLai<span>·</span>股票管理系统</div>
      <div class="nav-item active" data-view="overview" onclick="switchView('overview')">📊 数据概览</div>
      <div class="nav-item" data-view="notes" onclick="switchView('notes')">📝 笔记管理</div>
      <div class="nav-item" data-view="goldFinger" onclick="switchView('goldFinger')">☝️ 金手指数据</div>
      <div class="nav-item" data-view="users" onclick="switchView('users')">👤 用户管理</div>
      <div class="nav-item" data-view="orders" onclick="switchView('orders')">💳 会员订单</div>
      <div class="nav-item" data-view="darkFundOrders" onclick="switchView('darkFundOrders')">📈 暗盘工单</div>
      <div class="nav-item" data-view="giftCards" onclick="switchView('giftCards')">🎁 礼品卡管理</div>
      <div class="nav-item" data-view="withdrawals" onclick="switchView('withdrawals')">💰 提现审核<span class="nav-badge" id="withdrawBadge"></span></div>
      <div class="nav-item" data-view="points" onclick="switchView('points')">🧾 积分记录<span class="nav-badge" id="anomalyBadge"></span></div>
      <div class="nav-item" data-view="logs" onclick="switchView('logs')">📋 操作日志</div>
      <div class="nav-item" data-view="categories" onclick="switchView('categories')">🏷️ 笔记类型</div>
      <div class="nav-item" data-view="settings" onclick="switchView('settings')">⚙️ 功能设置</div>
    </div>
    <div class="main">
      <div class="topbar">
        <h2 id="viewTitle">数据概览</h2>
        <div class="user"><span id="who"></span><button onclick="logout()">退出</button></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

<script>
const API = '';
let token = localStorage.getItem('admin_token') || '';
let me = localStorage.getItem('admin_user') || '';

function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, opts.headers || {});
  return fetch(API + path, opts).then(async (r) => {
    if (r.status === 401) { logout(); throw new Error('未登录'); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || '请求失败');
    return data;
  });
}

function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  fetch(API + '/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  }).then(async (r) => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '登录失败');
    token = d.token; me = d.username;
    localStorage.setItem('admin_token', token);
    localStorage.setItem('admin_user', me);
    enterApp();
  }).catch((e) => document.getElementById('loginErr').textContent = e.message);
}

function logout() {
  token = ''; me = '';
  localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user');
  if (_badgeTimer) { clearInterval(_badgeTimer); _badgeTimer = null; }
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = '👋 ' + me;
  switchView('overview');
  refreshAdminBadges();
  if (_badgeTimer) clearInterval(_badgeTimer);
  _badgeTimer = setInterval(refreshAdminBadges, 30000);
}

let _badgeTimer = null;
let _adminToastTimer = null;
function showAdminToast(message, type = 'success') {
  const el = document.getElementById('adminToast');
  if (!el) return;
  if (_adminToastTimer) clearTimeout(_adminToastTimer);
  el.textContent = message;
  el.className = 'admin-toast ' + (type === 'error' ? 'error' : '') + ' show';
  _adminToastTimer = setTimeout(() => {
    el.className = 'admin-toast';
    _adminToastTimer = null;
  }, 3000);
}
const TITLES = { overview: '数据概览', notes: '笔记管理', goldFinger: '金手指数据', users: '用户管理', orders: '会员订单', darkFundOrders: '暗盘工单', aiImageTest: '暗盘工单处理', withdrawals: '提现审核', points: '积分记录', logs: '操作日志', categories: '笔记类型', settings: '功能设置' };
const BASE_CATEGORIES = ['资料', '课程', '金手指', '广告'];
TITLES.giftCards = '礼品卡管理';
function switchView(v) {
  if (v !== 'aiImageTest') cancelAiReviewTimer();
  const activeView = v === 'aiImageTest' ? 'darkFundOrders' : v;
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.view === activeView));
  document.getElementById('viewTitle').textContent = TITLES[v];
  if (v === 'overview') renderOverview();
  if (v === 'notes') renderNotes();
  if (v === 'goldFinger') renderGoldFinger();
  if (v === 'users') renderUsers();
  if (v === 'orders') renderPaymentOrders();
  if (v === 'darkFundOrders') renderDarkFundOrders();
  if (v === 'aiImageTest') renderAiImageTest();
  if (v === 'giftCards') renderGiftCards();
  if (v === 'withdrawals') renderWithdrawals();
  if (v === 'points') renderPointRecords();
  if (v === 'logs') renderOperationLogs();
  if (v === 'categories') renderCategories();
  if (v === 'settings') renderSettings();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// 概览
function renderOverview() {
  api('/api/admin/stats').then((s) => {
    document.getElementById('content').innerHTML = `
      <div class="cards">
        <div class="card"><div class="n">${s.notes}</div><div class="l">笔记总数</div></div>
        <div class="card"><div class="n">${s.materials}</div><div class="l">资料内容</div></div>
        <div class="card"><div class="n">${s.courses}</div><div class="l">课程内容</div></div>
        <div class="card"><div class="n">${s.goldNotes}</div><div class="l">金手指内容</div></div>
        <div class="card"><div class="n">${s.ads}</div><div class="l">广告内容</div></div>
        <div class="card"><div class="n">${s.users}</div><div class="l">用户总数</div></div>
        <div class="card"><div class="n">${s.newUsers}</div><div class="l">新注册用户</div></div>
        <div class="card"><div class="n">${s.vipUsers}</div><div class="l">VIP 用户</div></div>
        <div class="card"><div class="n">${s.categories}</div><div class="l">分类数</div></div>
      </div>`;
  });
}

// 笔记
const PAGE_SIZE = 10;
let _notes = [], _users = [], _categories = BASE_CATEGORIES.slice();
let _noteKeyword = '';
let _notePage = 1;

// 分页控件（右下角）
function pagerHtml(page, pages, total, fnName) {
  return `<div class="pager">
    <span class="pager-total">共 ${total} 条 · 第 ${page}/${pages} 页</span>
    <button class="btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="${fnName}(${page - 1})">上一页</button>
    <button class="btn-sm" ${page >= pages ? 'disabled' : ''} onclick="${fnName}(${page + 1})">下一页</button>
  </div>`;
}

function renderNotes() {
  Promise.all([api('/api/admin/notes'), api('/api/admin/users'), api('/api/admin/categories')])
    .then(([notes, users, categories]) => {
      _notes = notes; _users = users; _categories = categories;
      _notePage = 1;
      drawNotes();
    });
}

function doNoteSearch() {
  const inp = document.getElementById('noteSearch');
  _noteKeyword = (inp ? inp.value : '').trim();
  _notePage = 1;
  drawNotes();
}
function gotoNotePage(p) { _notePage = p; drawNotes(); }

function drawNotes() {
  const kw = _noteKeyword.toLowerCase();
  const all = kw ? _notes.filter((n) =>
    (n.title || '').toLowerCase().includes(kw) ||
    (n.content || '').toLowerCase().includes(kw) ||
    (n.category || '').toLowerCase().includes(kw) ||
    (n.author && (n.author.name || '').toLowerCase().includes(kw))
  ) : _notes;
  const total = all.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_notePage > pages) _notePage = pages;
  const start = (_notePage - 1) * PAGE_SIZE;
  const pageItems = all.slice(start, start + PAGE_SIZE);
  const rows = pageItems.map((n, i) => `
    <tr>
      <td>${start + i + 1}</td>
      <td><img src="${esc(n.cover)}" /></td>
      <td>${esc(n.title)}</td>
      <td>${esc(n.author && n.author.name)}</td>
      <td><span class="tag ${n.type === 'gold' ? 'gold' : (n.type === 'course' ? 'course' : (n.type === 'ad' ? 'ad' : ''))}">${esc(n.category || '资料')}</span></td>
      <td><div class="switch-cell"><label class="switch" title="是否显示"><input type="checkbox" ${n.visible !== false ? 'checked' : ''} onchange="toggleNoteFlag('${n.id}','visible',this.checked)" /><span class="switch-slider"></span></label><span>${n.visible !== false ? '显示' : '隐藏'}</span></div></td>
      <td><div class="switch-cell"><label class="switch" title="是否免费"><input type="checkbox" ${n.free === true ? 'checked' : ''} onchange="toggleNoteFlag('${n.id}','free',this.checked)" /><span class="switch-slider"></span></label><span>${n.free === true ? '免费' : '会员'}</span></div></td>
      <td>赞 ${n.likes} · 藏 ${n.collects}</td>
      <td>
        <button class="btn-sm" onclick='editNote("${n.id}")'>编辑</button>
        <button class="btn-sm del" onclick='delNote("${n.id}")'>删除</button>
      </td>
    </tr>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <input id="noteSearch" class="search" placeholder="按标题/内容/分类/作者搜索" value="${esc(_noteKeyword)}"
               onkeydown="if(event.key==='Enter')doNoteSearch()" />
        <button class="btn-primary" onclick="doNoteSearch()">搜索</button>
      </div>
      <button class="btn-primary" onclick="editNote()">+ 新增笔记</button>
    </div>
    <table><thead><tr><th>序号</th><th>封面</th><th>标题</th><th>作者</th><th>分类</th><th>是否显示</th><th>是否免费</th><th>互动数据</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${pagerHtml(_notePage, pages, total, 'gotoNotePage')}`;
}

function toggleNoteFlag(id, field, checked) {
  const label = field === 'visible' ? '显示状态' : '免费状态';
  api('/api/admin/notes/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify({ [field]: checked === true }) })
    .then((updated) => {
      const note = _notes.find((item) => item.id === id);
      if (note) note[field] = updated[field];
      showAdminToast(`${label}已更新`);
      drawNotes();
    })
    .catch((error) => {
      showAdminToast(error.message || `${label}更新失败`, 'error');
      renderNotes();
    });
}

let _modalImages = [];
function editNote(id) {
  const n = id ? _notes.find((x) => x.id === id) : {};
  const legacyLink = n.courseUrl || '';
  const baiduLink = n.baiduUrl || (legacyLink && !/quark\.cn/i.test(legacyLink) ? legacyLink : '');
  const quarkLink = n.quarkUrl || (legacyLink && /quark\.cn/i.test(legacyLink) ? legacyLink : '');
  const officialAuthors = _users.filter((u) => u.official === true);
  const userOpts = officialAuthors.map((u) => `<option value="${u.id}" ${n.authorId === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
  const selectedCategory = n.category || (n.type === 'gold' ? '金手指' : (n.type === 'course' ? '课程' : (n.type === 'ad' ? '广告' : '资料')));
  const riskDisclaimerEnabled = n.riskDisclaimerEnabled !== false;
  const categoryOpts = _categories.map((category) => `<option value="${esc(category)}" ${selectedCategory === category ? 'selected' : ''}>${esc(category)}</option>`).join('');
  if (!userOpts) return alert('请先在用户管理中创建并标记官方账号');
  _modalImages = (n.images || []).slice();
  openModal(`${id ? '编辑' : '新增'}内容`, `
    <div class="field"><label>标题</label><input id="f_title" value="${esc(n.title)}" /></div>
    <div class="field"><label>正文</label><textarea id="f_content">${esc(n.content)}</textarea></div>
    <div class="field"><label>作者</label><select id="f_author">${userOpts}</select></div>
    <div class="field"><label>笔记类型</label><select id="f_category" onchange="syncResourceField()">${categoryOpts}</select></div>
    <div id="resourceField">
      <div class="field"><label>百度网盘地址（选填）</label><input id="f_baidu" value="${esc(baiduLink)}" placeholder="百度网盘链接及提取码" /></div>
      <div class="field"><label>夸克网盘地址（选填）</label><input id="f_quark" value="${esc(quarkLink)}" placeholder="夸克网盘链接及提取码" /></div>
      <div class="hint">均为选填；前台始终显示「点击领取」，领取弹窗只展示已填写的网盘。</div>
    </div>
    <div class="field" id="goldHint"><div class="hint">金手指笔记的主图和「点击领取」均进入会员专属金手指页面，无需填写网盘地址。</div></div>
    <div class="field" id="adHint"><div class="hint">广告笔记作为Banner跳转页面，无需填写网盘地址。</div></div>
    <div class="field"><label>风险提示（狗头保命）</label><select id="f_risk_disclaimer">
      <option value="false" ${riskDisclaimerEnabled ? '' : 'selected'}>关闭</option>
      <option value="true" ${riskDisclaimerEnabled ? 'selected' : ''}>开启，自动添加风险提示</option>
    </select><div class="hint">开启后，笔记详情自动显示：数据来自交易所和互联网公开数据，由本人整理发布，不构成投资建议</div></div>
    <div class="field"><label>图片</label>
      <div id="imgGrid" class="img-grid"></div>
      <div class="hint">支持多图上传；拖拽图片可调整顺序，第一张为封面</div>
    </div>
    ${id ? `<div class="hint">互动数据：赞 ${n.likes || 0} · 藏 ${n.collects || 0}（不可修改）</div>` : ''}
  `, () => {
    const baiduUrl = document.getElementById('f_baidu').value.trim();
    const quarkUrl = document.getElementById('f_quark').value.trim();
    const category = document.getElementById('f_category').value;
    const type = category === '金手指' ? 'gold' : (category === '课程' ? 'course' : (category === '广告' ? 'ad' : 'material'));
    const body = {
      title: document.getElementById('f_title').value,
      content: document.getElementById('f_content').value,
      authorId: document.getElementById('f_author').value,
      type,
      category,
      baiduUrl,
      quarkUrl,
      riskDisclaimerEnabled: document.getElementById('f_risk_disclaimer').value === 'true',
      images: _modalImages,
    };
    const req = id ? api('/api/admin/notes/' + id, { method: 'PUT', body: JSON.stringify(body) })
                   : api('/api/admin/notes', { method: 'POST', body: JSON.stringify(body) });
    req.then(() => { closeModal(); renderNotes(); });
  });
  renderImgGrid();
  syncResourceField();
}

function syncResourceField() {
  const type = document.getElementById('f_category');
  const resource = document.getElementById('resourceField');
  const goldHint = document.getElementById('goldHint');
  const adHint = document.getElementById('adHint');
  if (!type || !resource || !goldHint || !adHint) return;
  const isGold = type.value === '金手指';
  const isAd = type.value === '广告';
  resource.style.display = isGold || isAd ? 'none' : 'block';
  goldHint.style.display = isGold ? 'block' : 'none';
  adHint.style.display = isAd ? 'block' : 'none';
}

let _dragImageIndex = -1;
function renderImgGrid() {
  const grid = document.getElementById('imgGrid');
  if (!grid) return;
  grid.innerHTML =
    _modalImages.map((url, i) => `
      <div class="img-cell" draggable="true" ondragstart="startImageDrag(event,${i})" ondragover="overImageDrag(event)" ondragleave="leaveImageDrag(event)" ondrop="dropImage(event,${i})" ondragend="endImageDrag()">
        <img src="${esc(url)}" />
        <span class="img-del" onclick="removeModalImage(${i})">×</span>
      </div>`).join('') +
    `<label class="img-add">＋<input type="file" accept="image/*" multiple style="display:none" onchange="onPickImages(event)" /></label>`;
}
function startImageDrag(event, i) {
  _dragImageIndex = i;
  event.currentTarget.classList.add('dragging');
  if (event.dataTransfer) event.dataTransfer.effectAllowed = 'move';
}
function overImageDrag(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}
function leaveImageDrag(event) { event.currentTarget.classList.remove('drag-over'); }
function dropImage(event, targetIndex) {
  event.preventDefault();
  if (_dragImageIndex < 0 || _dragImageIndex === targetIndex) return endImageDrag();
  const moved = _modalImages.splice(_dragImageIndex, 1)[0];
  _modalImages.splice(targetIndex, 0, moved);
  _dragImageIndex = -1;
  renderImgGrid();
}
function endImageDrag() {
  _dragImageIndex = -1;
  document.querySelectorAll('.img-cell').forEach((cell) => cell.classList.remove('dragging', 'drag-over'));
}
function removeModalImage(i) { _modalImages.splice(i, 1); renderImgGrid(); }
function onPickImages(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const grid = document.getElementById('imgGrid');
  if (grid) grid.style.opacity = '.5';
  Promise.all(files.map(uploadAdminImage))
    .then((urls) => { _modalImages = _modalImages.concat(urls.filter(Boolean)); renderImgGrid(); })
    .catch(() => alert('图片上传失败'))
    .then(() => { if (grid) grid.style.opacity = '1'; });
}
function uploadAdminImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  return fetch('/api/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd })
    .then((r) => r.json()).then((d) => d.url);
}

function delNote(id) {
  if (!confirm('确定删除这篇笔记吗？')) return;
  api('/api/admin/notes/' + id, { method: 'DELETE' }).then(renderNotes);
}

// 用户
function fmtDate(ts) { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function vipActive(u) { return u.vip && (u.vipPermanent || (u.vipExpire && u.vipExpire > Date.now())); }

let _userKeyword = '';
let _userPage = 1;
function renderUsers() {
  api('/api/admin/users').then((users) => {
    _users = users;
    _userPage = 1;
    drawUsers();
  });
}

// 点击「搜索」按钮才触发（避免中文输入法在输入过程中被打断）
function doUserSearch() {
  const inp = document.getElementById('userSearch');
  _userKeyword = (inp ? inp.value : '').trim();
  _userPage = 1;
  drawUsers();
}
function gotoUserPage(p) { _userPage = p; drawUsers(); }

function drawUsers() {
  const kw = _userKeyword.toLowerCase();
  const all = kw ? _users.filter((u) =>
    (u.name || '').toLowerCase().includes(kw) ||
    (u.id || '').toLowerCase().includes(kw) ||
    (u.phone || '').includes(kw)
  ) : _users;
  const total = all.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_userPage > pages) _userPage = pages;
  const start = (_userPage - 1) * PAGE_SIZE;
  const pageItems = all.slice(start, start + PAGE_SIZE);
  const rows = pageItems.map((u, i) => {
    const active = vipActive(u);
    const goldActive = Number(u.goldExpire) > Date.now();
    const darkFundActive = u.darkFundEnabled === true;
    const status = active
      ? (u.vipPermanent ? '<span class="tag vip">永久会员</span>' : `<span class="tag vip">${u.vipPlan === 'year' ? '年卡' : '月卡'} · 至 ${fmtDate(u.vipExpire)}</span>`)
      : (u.vipExpire ? '<span class="tag">已过期</span>' : '<span class="tag">未开通</span>');
    const goldStatus = goldActive
      ? `<span class="tag vip">金手指 · 至 ${fmtDate(u.goldExpire)}</span>`
      : (u.goldExpire ? '<span class="tag">已过期</span>' : '<span class="tag">未开通</span>');
    const darkFundStatus = darkFundActive
      ? `<span class="tag vip">已开通 · 剩余 ${Math.max(0, Number(u.darkFundRemaining) || 0)} 次</span><div class="hint">VIP ${Math.max(0, Number(u.darkFundVipRemaining) || 0)} · 后台 ${Math.max(0, Number(u.darkFundManualRemaining) || 0)}</div>`
      : '<span class="tag">未开通</span>';
    return `
      <tr>
        <td>${start + i + 1}</td>
        <td>${esc(u.name)}</td>
        <td>${esc(u.phone || '未绑定')}</td>
        <td>
          ${Array.isArray(u.tags) && u.tags.includes('new') ? '<span class="tag new">新用户</span>' : ''}
          <div class="hint">${esc(u.id)}</div>
          <div class="hint">${u.createdAt ? '注册于 ' + fmtDate(u.createdAt) : ''}</div>
        </td>
        <td>${u.official ? '<span class="tag course">官方账号</span>' : '<span class="tag">普通用户</span>'}</td>
        <td>${status}</td>
        <td>${goldStatus}</td>
        <td>${darkFundStatus}</td>
        <td>
          <button class="btn-sm" onclick='setVip("${u.id}","year")'>开通年卡</button>
          <button class="btn-sm" onclick='setVip("${u.id}","lifetime")'>开通永久卡</button>
          <button class="btn-sm del" ${active ? '' : 'disabled'} onclick='setVip("${u.id}","none")'>取消VIP</button>
          <button class="btn-sm" ${goldActive ? 'disabled' : ''} onclick='setGold("${u.id}","open")'>开通金手指</button>
          <button class="btn-sm del" ${goldActive ? '' : 'disabled'} onclick='setGold("${u.id}","cancel")'>取消金手指</button>
          <button class="btn-sm" ${darkFundActive ? 'disabled' : ''} onclick='setDarkFunds("${u.id}","open")'>开通暗盘资金</button>
          <button class="btn-sm del" ${darkFundActive ? '' : 'disabled'} onclick='setDarkFunds("${u.id}","cancel")'>关闭暗盘资金</button>
          <button class="btn-sm" onclick='setDarkFundQuota("${u.id}")'>设置查询次数</button>
          <button class="btn-sm" onclick='editUser("${u.id}")'>编辑</button>
        </td>
      </tr>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <input id="userSearch" class="search" placeholder="按昵称、手机号或会员编号搜索" value="${esc(_userKeyword)}"
               onkeydown="if(event.key==='Enter')doUserSearch()" />
        <button class="btn-primary" onclick="doUserSearch()">搜索</button>
      </div>
      <button class="btn-primary" onclick="editUser()">+ 新增用户</button>
    </div>
    <table><thead><tr><th>序号</th><th>昵称</th><th>手机号</th><th>注册信息</th><th>账号类型</th><th>VIP 状态</th><th>金手指状态</th><th>暗盘资金</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${pagerHtml(_userPage, pages, total, 'gotoUserPage')}`;
}

function setVip(id, plan) {
  const label = { year: '开通一年会员', lifetime: '开通永久会员', none: '取消VIP' }[plan];
  if (!confirm(`确定为该用户「${label}」吗？`)) return;
  api('/api/admin/users/' + id + '/vip', { method: 'PUT', body: JSON.stringify({ plan }) }).then(renderUsers);
}
function setGold(id, action) {
  const label = action === 'open' ? '开通一年金手指' : '取消金手指';
  if (!confirm(`确定为该用户「${label}」吗？`)) return;
  api('/api/admin/users/' + id + '/gold', { method: 'PUT', body: JSON.stringify({ action }) })
    .then(() => { showAdminToast(action === 'open' ? '金手指已开通' : '金手指已取消'); renderUsers(); })
    .catch((error) => showAdminToast(error.message || '操作失败', 'error'));
}
function setDarkFunds(id, action) {
  const label = action === 'open' ? '开通暗盘资金入口' : '关闭暗盘资金入口';
  if (!confirm(`确定为该用户「${label}」吗？`)) return;
  api('/api/admin/users/' + id + '/dark-funds', { method: 'PUT', body: JSON.stringify({ action }) })
    .then(() => { showAdminToast(action === 'open' ? '暗盘资金已开通' : '暗盘资金已关闭'); renderUsers(); })
    .catch((error) => showAdminToast(error.message || '操作失败', 'error'));
}
function setDarkFundQuota(id) {
  const user = _users.find((item) => item.id === id);
  if (!user) return;
  openModal('设置暗盘资金查询次数', `
    <div class="field"><label>用户</label><input value="${esc(user.name)}（${esc(user.id)}）" disabled /></div>
    <div class="field"><label>后台永久次数</label><input id="darkFundQuota" type="number" min="0" max="100000" step="1" value="${Math.max(0, Number(user.darkFundManualRemaining) || 0)}" /></div>
    <div class="hint">后台次数不会过期；VIP每个自然月另有10次且不结转，查询时优先使用VIP次数。</div>
  `, () => {
    const value = Number(document.getElementById('darkFundQuota').value);
    if (!Number.isInteger(value) || value < 0 || value > 100000) return showAdminToast('请输入0到100000之间的整数', 'error');
    api('/api/admin/users/' + id + '/dark-funds/quota', { method: 'PUT', body: JSON.stringify({ remaining: value }) })
      .then(() => { closeModal(); showAdminToast('查询次数已更新'); renderUsers(); })
      .catch((error) => showAdminToast(error.message || '保存失败', 'error'));
  });
}
function editUser(id) {
  const u = id ? _users.find((x) => x.id === id) : {};
  openModal(`${id ? '编辑' : '新增'}用户`, `
    <div class="field"><label>昵称</label><input id="u_name" value="${esc(u.name)}" /></div>

function setBadge(id, count) {
  const badge = document.getElementById(id);

  badge.textContent = value > 99 ? '99+' : value;

        ${_aiImageName ? `<div class="hint" style="margin-top:9px">当前图片：${esc(_aiImageName)}</div>` : ''}
        <div class="ai-upload-actions">
          <button class="btn-primary" onclick="document.getElementById('aiImageFile').click()">${_aiImageUrl ? '更换图片' : '选择图片'}</button>
          ${_aiImageUrl ? '<button class="btn-sm del" onclick="removeAiImage()">移除</button>' : ''}
          <button class="btn-primary" style="margin-left:auto" ${(!_aiImageUrl || !_aiOrderId || _aiImageBusy) ? 'disabled' : ''} onclick="startAiImageTest()">${_aiImageBusy ? '处理中…' : '开始识别'}</button>
        </div>
        ${reviewPanel ? `<div class="ai-under-image"><h3>字段校验与结果文字</h3><div class="hint">必要字段完整后自动补全文字；手动修改识别字段后也会自动重新校验。</div>${reviewPanel}</div>` : ''}
      </div>
      <div class="ai-result-card">
        <h3>识别字段</h3>
        <div class="hint">所有字段均可核对；手动修改后将自动校验并补全文字。</div>
        ${fieldsPanel}
      </div>
    </div>`;
}

function openAiImageForOrder(orderId) {
  cancelAiReviewTimer();
  _aiOrderId = String(orderId || '');
  const order = _darkFundOrders.find((item) => item.id === _aiOrderId) || {};
  _aiImageUrl = order.aiImageUrl || '';
  _aiImageName = _aiImageUrl ? '已上传工单截图' : '';
  _aiImageResult = order.aiAnalysis || null;
  _aiDraftText = order.aiDraftText || '';
  _aiAutoCompleteAt = Number(order.aiAutoCompleteAt) || 0;
  _aiFormDirty = false;
  _aiFormRevision = 0;
  switchView('aiImageTest');
}

function onAiImageDragOver(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}

function onAiImageDragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}

function onAiImageDrop(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
  if (file) uploadAiTestImage(file);
}

function onAiImagePicked(event) {
  const file = event.target.files && event.target.files[0];
  if (file) uploadAiTestImage(file);
  event.target.value = '';
}

function uploadAiTestImage(file) {
  if (!/^image\/(jpeg|png|gif|webp)$/i.test(file.type || '')) return showAdminToast('请选择 JPG、PNG、GIF 或 WebP 图片', 'error');
  if (file.size > 5 * 1024 * 1024) return showAdminToast('图片不能超过5MB', 'error');
  cancelAiReviewTimer();
  _aiImageBusy = true;
  drawAiImageTest();
  uploadAdminImage(file)
    .then((url) => {
      _aiImageUrl = url;
      _aiImageName = file.name || '已上传图片';
      _aiImageResult = null;
      _aiDraftText = '';
      _aiAutoCompleteAt = 0;
      _aiFormDirty = false;
      _aiFormRevision = 0;
      showAdminToast('图片上传成功');
    })
    .catch((error) => showAdminToast(error.message || '图片上传失败', 'error'))
    .finally(() => { _aiImageBusy = false; drawAiImageTest(); });
}

function removeAiImage() {
  cancelAiReviewTimer();
  _aiImageUrl = '';
  _aiImageName = '';
  _aiImageResult = null;
  _aiDraftText = '';
  _aiAutoCompleteAt = 0;
  _aiFormDirty = false;
  _aiFormRevision = 0;
  drawAiImageTest();
}

function startAiImageTest() {
  if (!_aiImageUrl || !_aiOrderId || _aiImageBusy) return;
  cancelAiReviewTimer();
  _aiImageBusy = true;
  _aiImageResult = null;
  drawAiImageTest();
  api('/api/admin/ai-image-test', { method: 'POST', body: JSON.stringify({ imageUrl: _aiImageUrl, orderId: _aiOrderId }) })
    .then((data) => {
      _aiImageResult = data.result;
      _aiDraftText = data.draftText || '';
      _aiAutoCompleteAt = Number(data.autoCompleteAt) || 0;
      _aiFormDirty = false;
      _aiFormRevision = 0;
      const selected = _aiOrders.find((item) => item.id === _aiOrderId);
      if (selected) Object.assign(selected, { aiAnalysis: data.result, aiDraftText: _aiDraftText, aiImageUrl: _aiImageUrl, aiAutoCompleteAt: _aiAutoCompleteAt });
      const passed = Boolean(data.result && data.result.validation && data.result.validation.passed);
      showAdminToast(passed ? '必要字段通过，结果文字已补全，3分钟后自动完成' : '必要字段缺失或资金校验有误，请人工核对', passed ? 'success' : 'error');
    })
    .catch((error) => showAdminToast(error.message || '识别失败', 'error'))
    .finally(() => { _aiImageBusy = false; drawAiImageTest(); });
}

function aiFieldValue(value) { return value === null || value === undefined ? '' : String(value); }
function aiInput(field, value, options = {}) {
  const attrs = options.readonly ? 'readonly' : `data-ai-field="${field}" oninput="scheduleAiReview()"`;
  const type = options.type || 'text';
  return `<input type="${type}" ${type === 'number' ? 'step="any"' : ''} ${attrs} value="${esc(aiFieldValue(value))}" />`;
}
function aiSelect(field, value, values) {
  return `<select data-ai-field="${field}" onchange="scheduleAiReview()">${values.map((item) => `<option value="${esc(item)}" ${item === value ? 'selected' : ''}>${esc(item || '请选择')}</option>`).join('')}</select>`;
}

function renderAiFields(result) {

  return `
    <div class="ai-result-grid">
      <div class="ai-result-item"><div class="label">股票名称</div>${aiInput('stockName', result.stockName)}</div>
      <div class="ai-result-item"><div class="label">股票代码（前台工单）</div>${aiInput('', result.stockCode, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">查询日期（前台工单）</div>${aiInput('', result.queryDate, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">请求时间（前台工单）</div>${aiInput('', result.requestedAtText, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">截图时间</div>${aiInput('capturedAt', result.capturedAt)}</div>
      <div class="ai-result-item"><div class="label">行情类型</div>${aiSelect('quoteType', result.quoteType, ['', '盘中', '收盘'])}</div>
      <div class="ai-result-item"><div class="label">当前价/收盘价</div>${aiInput('price', result.price, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">涨跌幅（%）</div>${aiInput('pctChange', result.pctChange, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">成交额</div>${aiInput('turnoverAmount', result.turnoverAmount, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">成交额单位</div>${aiSelect('turnoverAmountUnit', result.turnoverAmountUnit, ['', '元', '万元', '亿元'])}</div>
      <div class="ai-result-item"><div class="label">换手率（%）</div>${aiInput('turnoverRate', result.turnoverRate, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">资金单位</div>${aiSelect('unit', result.unit, ['', '元', '万元', '亿元'])}</div>
      <div class="ai-result-item"><div class="label">主力净流入</div>${aiInput('mainNet', result.mainNet, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">散户净流入</div>${aiInput('retailNet', result.retailNet, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">主力明盘</div>${aiInput('visibleNet', result.visibleNet, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">主力暗盘</div>${aiInput('darkNet', result.darkNet, { type: 'number' })}</div>
      <div class="ai-result-item"><div class="label">方向关系（自动）</div>${aiInput('', result.relation, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">资金情况（自动）</div>${aiInput('', processed.fundSituation, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">核心表现（自动）</div>${aiInput('', processed.corePerformance, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">解读（自动）</div>${aiInput('', processed.interpretation, { readonly: true })}</div>
      <div class="ai-result-item"><div class="label">说明（自动）</div>${aiInput('', processed.description, { readonly: true })}</div>
      <div class="ai-result-item" style="grid-column:1/-1"><div class="label">判断依据（自动）</div>${aiInput('', processed.basis, { readonly: true })}</div>
    </div>`;
}

function renderAiReviewPanel(result) {
  const validation = result.validation || {};
  const optionalMissing = Array.isArray(validation.optionalMissingFields) ? validation.optionalMissingFields : [];
  const autoCompleteText = validation.passed && _aiAutoCompleteAt
    ? `系统将在 ${new Date(_aiAutoCompleteAt).toLocaleTimeString('zh-CN', { hour12: false })} 自动完成工单`
    : '';
  return `
    <div class="ai-validation ${validation.passed ? 'pass' : 'fail'}">
      <strong>${validation.passed ? '✓ 必要字段校验通过' : '⚠ 必要字段需要人工核对'}</strong><br />
      必要字段：${validation.essentialFieldsPresent === true ? '完整 ✓' : '有缺失 ✕'}<br />
      明盘 + 暗盘：${esc(validation.fundSumExpression || '无法校验')} ${validation.fundSumPassed === true ? '✓' : '✕'}<br />
      主力 + 散户：${esc(validation.balanceExpression || '无法校验')} ${validation.balancePassed === true ? '✓' : '✕'}<br />
      非必要字段：${optionalMissing.length ? `${esc(optionalMissing.join('、'))}缺失，将删除对应分句` : '完整'}
      ${autoCompleteText ? `<br />${esc(autoCompleteText)}` : ''}
    </div>
    <div class="field" style="margin-top:16px"><label>结果文字</label><textarea id="aiDraftText" class="ai-report-editor" oninput="_aiDraftText=this.value">${esc(_aiDraftText)}</textarea></div>
    <div id="aiAutoReviewStatus" class="ai-auto-review-status">${_aiFormDirty ? '等待自动校验…' : '识别字段修改后自动校验并更新文字'}</div>
    <div class="ai-result-actions">
      <button id="aiCompleteOrderButton" class="btn-primary" ${(_aiImageBusy || !validation.passed || !_aiDraftText || _aiFormDirty) ? 'disabled' : ''} onclick="completeAiWorkOrder()">完成工单</button>
    </div>`;
}

function readAiAnalysisForm() {
  const result = {};
  document.querySelectorAll('[data-ai-field]').forEach((element) => {
    const field = element.dataset.aiField;
    if (!field) return;
    result[field] = element.type === 'number' ? (element.value === '' ? null : Number(element.value)) : element.value.trim();
  });
  return result;
}

function cancelAiReviewTimer() {
  if (_aiReviewTimer) clearTimeout(_aiReviewTimer);
  _aiReviewTimer = null;
}

function scheduleAiReview() {
  _aiFormDirty = true;
  _aiFormRevision += 1;
  const completeButton = document.getElementById('aiCompleteOrderButton');
  if (completeButton) completeButton.disabled = true;
  const status = document.getElementById('aiAutoReviewStatus');
  if (status) status.textContent = '等待自动校验…';
  cancelAiReviewTimer();
  _aiReviewTimer = setTimeout(runScheduledAiReview, 700);
}

function runScheduledAiReview() {
  _aiReviewTimer = null;
  if (!document.querySelector('.ai-upload-layout') || !_aiOrderId || !_aiImageResult) return;
  if (_aiImageBusy) {
    _aiReviewTimer = setTimeout(runScheduledAiReview, 300);
    return;
  }
  reviewAiWorkOrder();
}

function reviewAiWorkOrder() {
  if (_aiImageBusy || !_aiOrderId || !_aiImageResult) return;
  const revision = _aiFormRevision;
  const analysis = readAiAnalysisForm();
  _aiImageResult = analysis;
  _aiImageBusy = true;
  const status = document.getElementById('aiAutoReviewStatus');
  if (status) status.textContent = '正在自动校验并补全文字…';
  api('/api/admin/dark-fund-orders/' + encodeURIComponent(_aiOrderId) + '/ai-review', {
    method: 'POST', body: JSON.stringify({ analysis, imageUrl: _aiImageUrl }),
  }).then((data) => {
    if (revision !== _aiFormRevision) return;
    _aiImageResult = data.result;
    _aiDraftText = data.draftText || '';
    _aiAutoCompleteAt = Number(data.autoCompleteAt) || 0;
    _aiFormDirty = false;
    const passed = data.result && data.result.validation && data.result.validation.passed;
    showAdminToast(passed ? '已自动校验并补全文字' : '必要字段仍有缺失或误差，请继续核对', passed ? 'success' : 'error');
  }).catch((error) => {
    if (revision === _aiFormRevision) showAdminToast(error.message || '自动校验失败', 'error');
  }).finally(() => {
    _aiImageBusy = false;
    if (!document.querySelector('.ai-upload-layout')) return;
    if (revision !== _aiFormRevision) {
      cancelAiReviewTimer();
      _aiReviewTimer = setTimeout(runScheduledAiReview, 120);
      return;
    }
    drawAiImageTest();
  });
}

function completeAiWorkOrder() {
  if (_aiFormDirty) return showAdminToast('识别字段正在自动校验，请稍候', 'error');
  const validation = _aiImageResult && _aiImageResult.validation;
  const content = String((document.getElementById('aiDraftText') || {}).value || _aiDraftText || '').trim();
  if (!validation || validation.passed !== true) return showAdminToast('数据仍有疑问，不能完成工单', 'error');
  if (!content) return showAdminToast('结果文字不能为空', 'error');
  if (!_aiImageUrl) return showAdminToast('请上传工单截图', 'error');
  _aiImageBusy = true;
  api('/api/admin/dark-fund-orders/' + encodeURIComponent(_aiOrderId) + '/complete', {
    method: 'PUT', body: JSON.stringify({ content, images: [_aiImageUrl] }),
  }).then(() => {
    showAdminToast('工单已完成，用户将收到通知');
    switchView('darkFundOrders');
  }).catch((error) => showAdminToast(error.message || '工单完成失败', 'error'))
    .finally(() => { _aiImageBusy = false; });
}

// 会员订单
let _paymentOrders = [];
let _orderKeyword = '';
let _orderPage = 1;

function renderPaymentOrders() {
  api('/api/admin/payment-orders').then((orders) => {
    _paymentOrders = orders;
    _orderPage = 1;
    drawPaymentOrders();
  });
}

function doOrderSearch() {
  const input = document.getElementById('orderSearch');
  _orderKeyword = (input ? input.value : '').trim();
  _orderPage = 1;
  drawPaymentOrders();
}

function gotoOrderPage(page) { _orderPage = page; drawPaymentOrders(); }

function paymentStatus(order) {
  const labels = { SUCCESS: '已支付', NOTPAY: '待支付', CREATED: '创建中', FAILED: '失败', CLOSED: '已关闭', REFUND: '已退款' };
  const kind = order.status === 'SUCCESS' ? 'paid' : (order.status === 'FAILED' || order.status === 'CLOSED' ? '' : 'pending');
  return `<span class="tag ${kind}">${labels[order.status] || esc(order.status || '未知')}</span>`;
}

function drawPaymentOrders() {
  const keyword = _orderKeyword.toLowerCase();
  const all = keyword ? _paymentOrders.filter((order) => {
    const user = order.user || {};
    return (order.id || '').toLowerCase().includes(keyword) ||
      (user.id || '').toLowerCase().includes(keyword) ||
      (user.name || '').toLowerCase().includes(keyword) ||
      (user.phone || '').includes(keyword);
  }) : _paymentOrders;
  const total = all.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_orderPage > pages) _orderPage = pages;
  const start = (_orderPage - 1) * PAGE_SIZE;
  const rows = all.slice(start, start + PAGE_SIZE).map((order, index) => {
    const user = order.user || {};
    const redeemedAt = user.wechatGiftRedeemedAt || order.wechatGiftRedeemedAt;
    const giftState = redeemedAt
      ? `<span class="tag paid">已核销</span><div class="hint">${fmtDate(redeemedAt)} · 订单 ${esc(user.wechatGiftOrderId || order.id)}</div>`
      : (order.status === 'SUCCESS' ? '<span class="tag pending">待核销</span>' : '<span class="hint">支付后可核销</span>');
    return `<tr>
      <td>${start + index + 1}</td>
      <td><strong>${esc(order.id)}</strong><div class="hint">微信单号：${esc(order.transactionId || '—')}</div></td>
      <td>${esc(user.name || '用户不存在')}<div class="hint">${esc(user.id || order.userId || '')}</div><div class="hint">${esc(user.phone || '')}</div></td>
      <td>${order.plan === 'month' ? '月卡' : esc(order.plan)}<div class="hint">¥${((Number(order.amount) || 0) / 100).toFixed(2)}</div></td>
      <td>${paymentStatus(order)}</td>
      <td>${order.createdAt ? fmtDate(order.createdAt) : '—'}<div class="hint">${order.paidAt ? '支付于 ' + fmtDate(order.paidAt) : ''}</div></td>
      <td>${giftState}</td>
      <td><button class="btn-sm" ${order.giftEligible ? '' : 'disabled'} onclick='redeemWechatGift("${order.id}")'>核销赠送月卡</button></td>
    </tr>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <input id="orderSearch" class="search" placeholder="按订单号、昵称、手机号或会员编号搜索" value="${esc(_orderKeyword)}" onkeydown="if(event.key==='Enter')doOrderSearch()" />
        <button class="btn-primary" onclick="doOrderSearch()">搜索</button>
      </div>
      <div class="hint">添加企业微信赠送月卡：每个账号仅可核销一次</div>
    </div>
    <table><thead><tr><th>序号</th><th>订单号</th><th>用户</th><th>套餐/金额</th><th>支付状态</th><th>时间</th><th>赠送状态</th><th>操作</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px">暂无会员订单</td></tr>'}</tbody></table>
    ${pagerHtml(_orderPage, pages, total, 'gotoOrderPage')}`;
}

function redeemWechatGift(orderId) {
  if (!confirm('确认用户已经添加企业微信，并为该账号赠送一个月会员吗？每个账号只能赠送一次。')) return;
  api('/api/admin/payment-orders/' + encodeURIComponent(orderId) + '/wechat-gift', { method: 'PUT', body: '{}' })
    .then(() => { alert('核销成功，已续期30天'); renderPaymentOrders(); })
    .catch((error) => alert(error.message));
}

// 暗盘工单：用户提交后等待，管理员上传长截图，AI识别、校验并生成公开笔记。

let _darkFundOrderPage = 1;
let _darkFundResultImages = [];

function gotoDarkFundOrderPage(page) { _darkFundOrderPage = page; drawDarkFundOrders(); }

function drawDarkFundOrders() {

    <table><thead><tr><th>序号</th><th>股票/日期</th><th>查询用户</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>

function renderDarkFundResultImages() {
  const grid = document.getElementById('darkFundResultImages');
  if (!grid) return;
  grid.innerHTML = _darkFundResultImages.map((url, index) => `
    <div class="img-cell">
      <img src="${esc(url)}" />
      <span class="img-del" onclick="removeDarkFundResultImage(${index})">×</span>
    </div>`).join('') +
    `<label class="img-add">＋<input type="file" accept="image/*" multiple style="display:none" onchange="pickDarkFundResultImages(event)" /></label>`;
}

function removeDarkFundResultImage(index) {
  _darkFundResultImages.splice(index, 1);
  renderDarkFundResultImages();
}

function pickDarkFundResultImages(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  Promise.all(files.map(uploadAdminImage))
    .then((urls) => {
      _darkFundResultImages = _darkFundResultImages.concat(urls.filter(Boolean)).slice(0, 9);
      renderDarkFundResultImages();
    })
    .catch(() => showAdminToast('图片上传失败', 'error'));
}

function darkFundCopyDate(value) {
  const parts = String(value || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some((item) => !Number.isFinite(item))) return String(value || '');
  return `${parts[0]}年${parts[1]}月${parts[2]}日`;
}

function darkFundCopyTemplate(order) {
  const date = darkFundCopyDate(order.tradeDate);
  return `${date}，【股票名称】（${order.stockCode}）收盘报【收盘价】元，全天【上涨/下跌】【涨跌幅】%，成交额【成交额】亿元，换手率【换手率】%。从当日盘面看，【价格、成交量与盘面节奏概述】。

从资金层面看，当日明盘大单资金【净流入/净流出】【金额】亿元，暗盘资金【净流入/净流出】【金额】亿元。【结合当日明盘与暗盘方向，说明两者是同向、背离还是出现转折】。

从当日资金结构看，【只客观描述明暗资金的强弱、同向或背离特征】。这类现象只能反映当日资金变化，不单独用于判断后续价格走势。

暗盘资金只看当日有局限性，建议结合连续5个交易日的暗盘数据进行判断。

风险提示：以上分析结果仅代表大模型观点，仅供参考，不作为投资建议。本文不涉及投资咨询，提及股票不视为明示或暗示推荐，也不应理解为对未来收益的预期或保证。每个指标都有局限性，请理性判断，注意风险。`;
}

function completeDarkFundOrder(orderId) {
  const order = _darkFundOrders.find((item) => item.id === orderId);
  if (!order) return;
  _darkFundResultImages = [];
  const template = darkFundCopyTemplate(order);
  openModal(`录入查询结果 · ${esc(order.stockCode)}`, `
    <div class="field"><label>结果文字</label><textarea id="darkFundResultText" style="min-height:420px">${esc(template)}</textarea><div class="hint">请将【】内的提示全部替换为实际数据，可保留或调整五段结构。</div></div>
    <div class="field"><label>暗盘资金截图</label><div id="darkFundResultImages" class="img-grid"></div><div class="hint">最多9张，第一张作为笔记封面。</div></div>
  `, () => {
    const content = document.getElementById('darkFundResultText').value.trim();
    if (!content) return showAdminToast('请填写结果文字', 'error');
    if (/[【】]/.test(content)) return showAdminToast('请先替换文案中的所有【】占位内容', 'error');
    if (!_darkFundResultImages.length) return showAdminToast('请上传暗盘资金截图', 'error');
    api('/api/admin/dark-fund-orders/' + encodeURIComponent(orderId) + '/complete', {
      method: 'PUT',
      body: JSON.stringify({ content, images: _darkFundResultImages }),
    }).then(() => {
      closeModal();
      showAdminToast('查询结果已就绪，用户将收到通知');
      renderDarkFundOrders();
    }).catch((error) => showAdminToast(error.message || '工单完成失败', 'error'));
  });
  renderDarkFundResultImages();
}

function openDarkFundSnapshot(orderId) {
  const order = _darkFundOrders.find((item) => item.id === orderId);

// 提现审核
let _withdrawals = [];
let _withdrawKeyword = '';
let _withdrawPage = 1;

function renderWithdrawals() {
  api('/api/admin/withdrawals').then((list) => {
    _withdrawals = list;
    _withdrawPage = 1;
    drawWithdrawals();
  });
}

function doWithdrawSearch() {
  const input = document.getElementById('withdrawSearch');
  _withdrawKeyword = (input ? input.value : '').trim();
  _withdrawPage = 1;
  drawWithdrawals();
}

function gotoWithdrawPage(page) { _withdrawPage = page; drawWithdrawals(); }

function withdrawalStatus(status) {
  const labels = { PENDING: '待审核', APPROVED: '通过待打款', REJECTED: '已拒绝退款', PAID: '已打款' };
  const kinds = { PENDING: 'pending', APPROVED: 'approved', REJECTED: 'rejected', PAID: 'paid' };
  return `<span class="tag ${kinds[status] || ''}">${labels[status] || esc(status)}</span>`;
}

function drawWithdrawals() {
  const keyword = _withdrawKeyword.toLowerCase();
  const filtered = keyword ? _withdrawals.filter((item) => {
    const user = item.user || {};
    return [item.id, item.realName, item.contact, user.id, user.name, user.phone]
      .some((value) => String(value || '').toLowerCase().includes(keyword));
  }) : _withdrawals;
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_withdrawPage > pages) _withdrawPage = pages;
  const start = (_withdrawPage - 1) * PAGE_SIZE;
  const rows = filtered.slice(start, start + PAGE_SIZE).map((item, index) => {
    const user = item.user || {};
    let actions = '<span class="hint">—</span>';
    if (item.status === 'PENDING') actions = `<button class="btn-sm" onclick="reviewWithdrawal('${item.id}','approve')">通过</button><button class="btn-sm del" onclick="reviewWithdrawal('${item.id}','reject')">拒绝并退积分</button>`;
    if (item.status === 'APPROVED') actions = `<button class="btn-sm" onclick="reviewWithdrawal('${item.id}','paid')">确认已打款</button><button class="btn-sm del" onclick="reviewWithdrawal('${item.id}','reject')">拒绝并退积分</button>`;
    return `<tr>
      <td>${start + index + 1}</td>
      <td><strong>${esc(item.id)}</strong><div class="hint">${fmtDate(item.createdAt)}</div></td>
      <td>${esc(user.name || '用户不存在')}<div class="hint">${esc(user.id || item.userId)}</div><div class="hint">当前余额 ${Number(item.currentBalance) || 0} 积分</div></td>
      <td><strong>¥${Number(item.amountYuan || 0).toFixed(2)}</strong><div class="hint">冻结 ${Number(item.points) || 0} 积分</div></td>
      <td>${esc(item.realName)}<div class="hint">${esc(item.contact)}</div><div class="hint">${esc(item.remark || '')}</div></td>
      <td>${withdrawalStatus(item.status)}${item.reviewNote ? `<div class="hint">${esc(item.reviewNote)}</div>` : ''}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
  const pending = _withdrawals.filter((item) => item.status === 'PENDING').length;
  const approved = _withdrawals.filter((item) => item.status === 'APPROVED').length;
  document.getElementById('content').innerHTML = `
    <div class="cards" style="margin-bottom:20px">
      <div class="card"><div class="n">${pending}</div><div class="l">待人工审核</div></div>
      <div class="card"><div class="n">${approved}</div><div class="l">待人工打款</div></div>
      <div class="card"><div class="n">${_withdrawals.filter((item) => item.status === 'PAID').length}</div><div class="l">已完成打款</div></div>
    </div>
    <div class="toolbar"><div class="search-box"><input id="withdrawSearch" class="search" placeholder="按申请号、用户或收款信息搜索" value="${esc(_withdrawKeyword)}" onkeydown="if(event.key==='Enter')doWithdrawSearch()" /><button class="btn-primary" onclick="doWithdrawSearch()">搜索</button></div><div class="hint">仅人工审核，不启用设备、IP或频次风控</div></div>
    <table><thead><tr><th>序号</th><th>申请单</th><th>用户</th><th>金额</th><th>收款信息</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:#999;padding:40px">暂无提现申请</td></tr>'}</tbody></table>
    ${pagerHtml(_withdrawPage, pages, total, 'gotoWithdrawPage')}`;
}

function reviewWithdrawal(id, action) {
  const labels = { approve: '通过审核并进入待打款', reject: '拒绝申请并退回积分', paid: '确认已经完成微信打款' };
  if (!confirm(`确认${labels[action]}？`)) return;
  const note = prompt('审核说明（可留空）', '') || '';
  api('/api/admin/withdrawals/' + encodeURIComponent(id) + '/review', { method: 'PUT', body: JSON.stringify({ action, note }) })
    .then(() => { refreshAdminBadges(); renderWithdrawals(); }).catch((error) => alert(error.message));
}
