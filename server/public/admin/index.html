// 独立金手指每日数据
let _goldFingerRecords = [];
let _goldFingerBanners = [];
let _goldFingerNotes = [];
let _bannerModalImage = '';
let _goldFingerPage = 1;
let _goldFingerImportInitialized = false;
const GOLD_FINGER_PAGE_SIZE = 10;

function chinaToday() {
  return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
}

function renderGoldFinger(page = _goldFingerPage) {
  _goldFingerPage = Math.max(1, Number(page) || 1);
  Promise.all([
    api(`/api/admin/gold-finger?page=${_goldFingerPage}&size=${GOLD_FINGER_PAGE_SIZE}`),
    api('/api/admin/gold-finger-banners'),
    api('/api/admin/notes'),
    api('/api/admin/gold-finger/import-status'),
  ]).then(([recordPage, banners, notes, importStatus]) => {
    const records = recordPage && recordPage.list ? recordPage.list : [];
    const pages = Math.max(1, Number(recordPage && recordPage.pages) || 1);
    const total = Number(recordPage && recordPage.total) || 0;
    if (_goldFingerPage > pages) return renderGoldFinger(pages);
    _goldFingerRecords = records;
    _goldFingerBanners = banners || [];
    _goldFingerNotes = (notes || []).filter((note) => note.type === 'ad');
    _goldFingerImportInitialized = !!(importStatus && importStatus.initialized);
    const noteMap = {};
    _goldFingerNotes.forEach((note) => { noteMap[note.id] = note; });
    const bannerCards = _goldFingerBanners.map((item, index) => `<div class="banner-admin-card">
      <img src="${esc(item.image)}" />
      <div class="banner-admin-info">
        <div class="banner-admin-title">跳转：${esc(noteMap[item.noteId] && noteMap[item.noteId].title || '笔记不存在')}</div>
        <div class="banner-admin-actions">
          <button class="btn-sm" ${index === 0 ? 'disabled' : ''} onclick="moveGoldBanner(${index},-1)">上移</button>
          <button class="btn-sm" ${index === _goldFingerBanners.length - 1 ? 'disabled' : ''} onclick="moveGoldBanner(${index},1)">下移</button>
          <button class="btn-sm" onclick="editGoldBanner(${index})">编辑</button>
          <button class="btn-sm del" onclick="deleteGoldBanner(${index})">删除</button>
        </div>
      </div>
    </div>`).join('');
    const rows = _goldFingerRecords.map((item, index) => `<tr>
      <td>${(_goldFingerPage - 1) * GOLD_FINGER_PAGE_SIZE + index + 1}</td>
      <td><strong>${esc(item.date)}</strong></td>
      <td>${Number(item.yang)} / ${100 - Number(item.yang)}</td>
      <td><span class="tag ${item.finger === 'gold' ? 'gold' : ''}">${item.finger === 'gold' ? '金手指' : '银手指'}</span></td>
      <td><img src="${item.trend === 'up' ? '/assets/trend-up.png' : '/assets/trend-down.png'}" alt="${item.trend === 'up' ? '上涨' : '下跌'}" style="display:block;width:28px;height:28px;object-fit:contain;margin:auto" /></td>
      <td>${Number(item.position)}%</td>
      <td>${fmtDate(item.updatedAt)}</td>
      <td><button class="btn-sm" onclick="editGoldFinger('${esc(item.date)}')">编辑</button><button class="btn-sm del" onclick="deleteGoldFinger('${esc(item.date)}')">删除</button></td>
    </tr>`).join('');
    document.getElementById('content').innerHTML = `
      <div class="card" style="margin-bottom:20px">
        <div class="toolbar"><div><h3>注入 JSON 数据</h3><div class="hint">${_goldFingerImportInitialized ? '增量模式：历史已有日期不覆盖，数组最后一项可更新。' : '首次初始化模式：本次会覆盖这批日期的已有数据，完成后自动转为增量模式。'} 支持直接数组或 { "list": [...] } 格式；阳/阴谱自动取整且保持合计100；“-”会继承前一个交易日的金/银手指。</div></div></div>
        <textarea id="goldJsonImport" style="width:100%;min-height:240px;box-sizing:border-box;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.55" placeholder='粘贴 JSON：可直接粘贴 [ ... ]，也可粘贴 { "list": [ ... ] }'></textarea>
        <div class="gold-form-actions" style="margin-top:12px"><button class="btn-primary" onclick="importGoldFingerJson()">注入 JSON</button></div>
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="toolbar"><div><h3>金手指页面 Banner</h3><div class="hint">上传轮播图片并选择广告类型笔记；前台点击图片后进入对应广告笔记。</div></div><button class="btn-primary" onclick="editGoldBanner(-1)">+ 新增Banner</button></div>
        <div class="banner-admin-list">${bannerCards || '<div class="hint">暂未配置轮播图</div>'}</div>
      </div>
      <div class="toolbar"><h3>历史记录</h3><div class="hint">共${total}条；点击“编辑”在弹窗中维护既有日期，新增数据请使用 JSON 注入</div></div>
      <table><thead><tr><th>序号</th><th>日期</th><th>阳谱 / 阴谱</th><th>金银手指</th><th>趋势</th><th>水位</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px">暂无金手指数据</td></tr>'}</tbody></table>`;
    document.getElementById('content').innerHTML += pagerHtml(_goldFingerPage, pages, total, 'gotoGoldFingerPage');
  }).catch((error) => alert(error.message));
}

function gotoGoldFingerPage(page) { renderGoldFinger(page); }

function saveGoldBanners(banners) {
  return api('/api/admin/gold-finger-banners', { method: 'PUT', body: JSON.stringify({ banners: banners || _goldFingerBanners }) });
}

function renderGoldBannerPicker() {
  const root = document.getElementById('goldBannerPicker');
  if (!root) return;
  root.innerHTML = `<div class="banner-picker">
    ${_bannerModalImage ? `<img class="banner-preview" src="${esc(_bannerModalImage)}" />` : '<div class="banner-preview"></div>'}
    <label class="avatar-upload-btn">${_bannerModalImage ? '更换图片' : '上传图片'}<input type="file" accept="image/*" style="display:none" onchange="onPickGoldBanner(event)" /></label>
  </div>`;
}

function onPickGoldBanner(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  uploadAdminImage(file)
    .then((url) => { _bannerModalImage = url; renderGoldBannerPicker(); })
    .catch(() => alert('Banner图片上传失败'));
}

function editGoldBanner(index) {
  const item = index >= 0 ? _goldFingerBanners[index] : null;
  _bannerModalImage = item ? item.image : '';
  const noteOptions = _goldFingerNotes.map((note) => `<option value="${esc(note.id)}" ${item && item.noteId === note.id ? 'selected' : ''}>${esc(note.title)}</option>`).join('');
  if (!noteOptions) return alert('请先创建广告类型笔记');
  openModal(index >= 0 ? '编辑Banner' : '新增Banner', `
    <div class="field"><label>轮播图片</label><div id="goldBannerPicker"></div><div class="hint">建议使用横版图片，大小不超过5MB</div></div>
    <div class="field"><label>点击后跳转的笔记</label><select id="goldBannerNote">${noteOptions}</select></div>
  `, () => {
    if (!_bannerModalImage) return alert('请上传轮播图片');
    const next = { id: item && item.id || '', image: _bannerModalImage, noteId: document.getElementById('goldBannerNote').value };
    const banners = _goldFingerBanners.slice();
    if (index >= 0) banners[index] = next;
    else banners.push(next);
    saveGoldBanners(banners).then(() => { closeModal(); renderGoldFinger(); }).catch((error) => alert(error.message));
  });
  renderGoldBannerPicker();
}

function moveGoldBanner(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= _goldFingerBanners.length) return;
  const banners = _goldFingerBanners.slice();
  const moved = banners[index];
  banners[index] = banners[target];
  banners[target] = moved;
  saveGoldBanners(banners).then(renderGoldFinger).catch((error) => alert(error.message));
}

function deleteGoldBanner(index) {
  if (!confirm('确定删除这张Banner吗？')) return;
  const banners = _goldFingerBanners.filter((item, itemIndex) => itemIndex !== index);
  saveGoldBanners(banners).then(renderGoldFinger).catch((error) => alert(error.message));
}

function editGoldFinger(date) {
  const item = _goldFingerRecords.find((record) => record.date === date);
  if (!item) return;
  openGoldFingerEditor(item);
}

function openGoldFingerEditor(item) {
  if (!item) return;
  openModal(`维护每日数据 · ${esc(item.date)}`, `
    <div class="field"><label>日期</label><input value="${esc(item.date)}" disabled /></div>
    <div class="field"><label>阳谱（0-100，阴谱自动计算）</label><input id="goldModalYang" type="number" min="0" max="100" step="1" value="${Number(item.yang)}" /></div>
    <div class="field"><label>金银手指</label><select id="goldModalFinger"><option value="gold" ${item.finger === 'gold' ? 'selected' : ''}>金手指</option><option value="silver" ${item.finger === 'silver' ? 'selected' : ''}>银手指</option></select></div>
    <div class="field"><label>趋势</label><select id="goldModalTrend"><option value="up" ${item.trend === 'up' ? 'selected' : ''}>上涨</option><option value="down" ${item.trend === 'down' ? 'selected' : ''}>下跌</option></select></div>
    <div class="field"><label>水位（0-100）</label><input id="goldModalPosition" type="number" min="0" max="100" step="1" value="${Number(item.position)}" /></div>
  `, () => {
    const body = {
      yang: Number(document.getElementById('goldModalYang').value),
      finger: document.getElementById('goldModalFinger').value,
      trend: document.getElementById('goldModalTrend').value,
      position: Number(document.getElementById('goldModalPosition').value),
    };
    api('/api/admin/gold-finger/' + encodeURIComponent(item.date), { method: 'PUT', body: JSON.stringify(body) })
      .then(() => { closeModal(); showAdminToast('金手指数据已更新'); renderGoldFinger(); })
      .catch((error) => showAdminToast(error.message || '更新失败', 'error'));
  });
}

function importGoldFingerJson() {
  const input = document.getElementById('goldJsonImport');
  const jsonText = input && input.value.trim();
  if (!jsonText) return showAdminToast('请先粘贴 JSON 数据', 'error');
  const confirmText = _goldFingerImportInitialized
    ? '确认增量注入吗？历史已有日期不会覆盖，只有数组最后一项会更新。'
    : '确认首次初始化吗？本次会覆盖这批日期的已有数据；完成后以后的导入不再覆盖历史数据。';
  if (!confirm(confirmText)) return;
  api('/api/admin/gold-finger/import', { method: 'POST', body: JSON.stringify({ jsonText }) })
    .then((result) => {
      const inferred = result.initialFingerInferred ? `，首段补齐${result.initialFingerInferred}条` : '';
      showAdminToast(`${result.initializing ? '首次初始化完成' : '增量注入完成'}：新增${result.created}条，更新${result.updated}条，保留${result.skipped}条${inferred}`);
      renderGoldFinger(1);
    })
    .catch((error) => showAdminToast(error.message || 'JSON 注入失败', 'error'));
}

function deleteGoldFinger(date) {
  if (!confirm(`确定删除 ${date} 的金手指数据吗？`)) return;
  api('/api/admin/gold-finger/' + encodeURIComponent(date), { method: 'DELETE' })
    .then(renderGoldFinger).catch((error) => alert(error.message));
}

// 分类
function renderCategories() {
  Promise.all([api('/api/admin/categories'), api('/api/admin/notes')]).then(([cats, notes]) => {
    _categories = cats;
    const items = cats.map((cat) => {
      const fixed = BASE_CATEGORIES.includes(cat);
      const count = notes.filter((n) => n.category === cat).length;
      return `<div class="category-row">
        <div class="category-main"><strong>${esc(cat)}</strong>${fixed ? '<span class="tag">系统类型</span>' : ''}<span class="tag">${count} 篇</span></div>
        <div class="category-actions">
          ${fixed ? '<span class="hint">不可修改或删除</span>' : `<button class="btn-sm" onclick="renameCategory(decodeURIComponent('${encodeURIComponent(cat)}'))">重命名</button><button class="btn-sm del" onclick="deleteCategory(decodeURIComponent('${encodeURIComponent(cat)}'))">删除</button>`}
        </div>
      </div>`;
    }).join('');
    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:560px">
        <div class="field">
          <label>新增笔记类型</label>
          <div class="search-box"><input id="newCategoryName" class="search" maxlength="12" placeholder="输入类型名称" /><button class="btn-primary" onclick="addCategory()">新增</button></div>
          <div class="hint">资料、课程、金手指、广告为系统类型，永久保留；自定义类型按资料类领取逻辑处理。</div>
        </div>
        ${items}
      </div>`;
  });
}

function addCategory() {
  const input = document.getElementById('newCategoryName');
  const name = (input ? input.value : '').trim();
  if (!name) return alert('请输入笔记类型名称');
  api('/api/admin/categories', { method: 'POST', body: JSON.stringify({ name }) })
    .then(renderCategories).catch((error) => alert(error.message));
}
function renameCategory(oldName) {
  const name = prompt('请输入新的笔记类型名称', oldName);
  if (name == null || !name.trim() || name.trim() === oldName) return;
  api('/api/admin/categories/' + encodeURIComponent(oldName), { method: 'PUT', body: JSON.stringify({ name: name.trim() }) })
    .then(renderCategories).catch((error) => alert(error.message));
}
function deleteCategory(name) {
  if (!confirm(`确定删除笔记类型「${name}」吗？`)) return;
  api('/api/admin/categories/' + encodeURIComponent(name), { method: 'DELETE' })
    .then(renderCategories).catch((error) => alert(error.message));
}

// 功能设置
function renderSettings() {
  Promise.all([api('/api/admin/settings'), api('/api/admin/notes')]).then(([settings, notes]) => {
    const noteOptions = notes.filter((n) => n.type === 'gold').map((n) => `
      <option value="${esc(n.id)}" ${n.id === settings.featuredNoteId ? 'selected' : ''}>
        ${esc(n.title)}（${esc(n.author && n.author.name)}）
      </option>`).join('');
    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:640px">
        <div class="field">
          <label>底部金手指入口打开的笔记</label>
          <select id="settingFeatured">${noteOptions}</select>
          <div class="hint">这篇笔记的主图和「点击领取」均作为金手指功能入口；仅金手指权益或VIP有效的用户能看到入口及金手指笔记。</div>
        </div>
        <div class="field">
          <label>普通笔记激励广告</label>
          <select id="settingAd">
            <option value="false" ${settings.rewardedAdEnabled ? '' : 'selected'}>关闭</option>
            <option value="true" ${settings.rewardedAdEnabled ? 'selected' : ''}>开启</option>
          </select>
          <div class="hint">关闭后直接展示领取链接；开启后需看完激励广告才能领取。</div>
        </div>
        <div class="field">
          <label>VIP 功能</label>
          <select id="settingVip">
            <option value="false" ${settings.vipEnabled ? '' : 'selected'}>关闭</option>
            <option value="true" ${settings.vipEnabled ? 'selected' : ''}>开启</option>
          </select>
          <div class="hint">开启：非免费普通笔记校验VIP，有效VIP免广告领取，无效则提示开通月卡；关闭：普通笔记不校验VIP，按广告设置领取。金手指始终单独按「金手指权益或有效VIP」判断，不受此开关影响。</div>
        </div>
        <div class="field">
          <label>热门搜索</label>
          <textarea id="settingHotSearch" placeholder="每行填写一个热门搜索词">${esc((settings.hotSearch || []).join('\n'))}</textarea>
          <div class="hint">每行一个，最多20项；保存后展示在小程序搜索页。</div>
        </div>
        <button class="btn-primary" onclick="saveSettings()">保存设置</button>
      </div>`;
  });
}

function saveSettings() {
  const body = {
    featuredNoteId: document.getElementById('settingFeatured').value,
    rewardedAdEnabled: document.getElementById('settingAd').value === 'true',
    vipEnabled: document.getElementById('settingVip').value === 'true',
    hotSearch: Array.from(new Set(document.getElementById('settingHotSearch').value.split(/[\n,，]/).map((item) => item.trim()).filter(Boolean))),
  };
  api('/api/admin/settings', { method: 'PUT', body: JSON.stringify(body) })
    .then(() => showAdminToast('设置已保存'))
    .catch((error) => showAdminToast(error.message || '保存失败，请稍后重试', 'error'));
}

let _giftGenerating = false;
function renderGiftCards(page = 1) {
  api('/api/admin/gift-cards?page=' + page).then((result) => {
    if (document.getElementById('viewTitle').textContent !== TITLES.giftCards) return;
    const rows = result.list.map((card) => {
      const code = card.code || '';
      const copyButton = code ? `<button class="btn-sm" onclick='copyGiftCode(${JSON.stringify(code)})'>复制卡密</button>` : '<span class="hint">历史卡密不可复制</span>';
      const label = code || (card.type === 'gold' ? '金手指年卡' : '月卡');
      return `<tr><td style="font-family:monospace">${esc(code || '—')}</td><td>${card.type === 'gold' ? '金手指年卡' : '月卡'}</td><td>${card.status === 'redeemed' ? '已兑换' : '未兑换'}</td><td>${esc(card.redeemedBy || '—')}</td><td>${fmtDate(card.createdAt)}</td><td>${card.redeemedAt ? fmtDate(card.redeemedAt) : '—'}</td><td>${copyButton}<button class="btn-sm del" onclick='deleteGiftCard(${JSON.stringify(card.id)},${JSON.stringify(label)})'>删除</button></td></tr>`;
    }).join('');
    document.getElementById('content').innerHTML = `
      <div class="card" style="margin-bottom:20px"><h3>生成礼品卡</h3>
        <div class="hint">月卡增加30天会员；金手指年卡单独增加金手指权益，默认360天。同类权益从现有到期时间顺延，每张卡密仅可使用一次。</div>
        <div class="toolbar" style="display:flex;flex-wrap:wrap;gap:16px;margin-top:16px">
          <label>类型 <select id="giftType"><option value="gold">金手指年卡</option><option value="month">月卡</option></select></label>
          <label>生成数量 <input id="giftCount" type="number" min="1" max="10" value="10" style="width:80px" /></label>
          <button class="btn-primary" id="giftGenerate" onclick="generateGiftCards()">生成卡密</button>
        </div>
      </div>
      <h3>礼品卡记录</h3><table><thead><tr><th>卡密</th><th>权益</th><th>状态</th><th>兑换账号ID</th><th>生成时间</th><th>兑换时间</th><th>操作</th></tr></thead><tbody>${rows || '<tr><td colspan="7">暂无礼品卡</td></tr>'}</tbody></table>
      ${pagerHtml(result.page, result.pages, result.total, 'renderGiftCards')}`;
    document.getElementById('giftGenerate').disabled = _giftGenerating;
  }).catch((error) => showAdminToast(error.message, 'error'));
}
function generateGiftCards() {
  if (_giftGenerating) return;
  const type = document.getElementById('giftType').value;
  const count = Number(document.getElementById('giftCount').value);
  if (!Number.isInteger(count) || count < 1 || count > 10) return showAdminToast('一次生成1至10张', 'error');
  _giftGenerating = true;
  const button = document.getElementById('giftGenerate');
  button.disabled = true;
  api('/api/admin/gift-cards', { method: 'POST', body: JSON.stringify({ type, count }) }).then(() => {
    if (!token) return;
    renderGiftCards();
    showAdminToast('卡密已生成');
  }).catch((error) => showAdminToast(error.message, 'error')).finally(() => { _giftGenerating = false; button.disabled = false; });
}
function copyGiftCode(code) {
  if (!navigator.clipboard) return showAdminToast('当前浏览器不支持复制', 'error');
  navigator.clipboard.writeText(code).then(() => showAdminToast('卡密已复制')).catch(() => showAdminToast('复制失败', 'error'));
}
function deleteGiftCard(id, label) {
  if (!confirm(`确定删除礼品卡「${label}」吗？删除后该卡密将无法兑换。`)) return;
  api('/api/admin/gift-cards/' + encodeURIComponent(id), { method: 'DELETE' })
    .then(() => { showAdminToast('礼品卡已删除'); renderGiftCards(); })
    .catch((error) => showAdminToast(error.message || '删除失败', 'error'));
}

// 弹窗
function openModal(title, html, onOk) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>${esc(title)}</h3>
        ${html}
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">取消</button>
          <button class="btn-primary" id="modalOk">保存</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalOk').onclick = onOk;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

// 自动登录
if (token) enterApp();
</script>
</body>
</html>
